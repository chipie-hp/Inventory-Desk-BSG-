<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>BSG — Inventory Desk | Full & Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ----- CSS (same as before, fully included) ----- */
:root{
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--surface3:#252830;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f0;--text2:#9a9da6;--text3:#5a5d68;
  --accent:#d4a843;--accent2:#e8c06a;
  --green:#3db87a;--green-bg:rgba(61,184,122,0.1);--green-text:#5dd49a;
  --amber:#d4a843;--amber-bg:rgba(212,168,67,0.1);--amber-text:#e8c06a;
  --red:#c0392b;--red-bg:rgba(192,57,43,0.12);--red-text:#e57373;
  --blue:#4a90d9;--blue-bg:rgba(74,144,217,0.1);--blue-text:#6aaae8;
  --radius:8px;--radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow-x:hidden}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--surface2)}
button{font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-radius:var(--radius);padding:8px 18px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);transition:all .15s}
button:hover{background:var(--surface3)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#0e0f11;border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent2)}
button.success{background:var(--green);color:#0e0f11;border-color:var(--green);font-weight:600}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;font-family:'DM Mono',monospace}
.bg{background:var(--green-bg);color:var(--green-text)}
.bw{background:var(--amber-bg);color:var(--amber-text)}
.bd{background:var(--red-bg);color:var(--red-text)}
.bi{background:var(--blue-bg);color:var(--blue-text)}
.bm{background:var(--surface3);color:var(--text2)}
.bl{background:rgba(61,184,122,0.15);color:var(--green-text);border:1px solid rgba(61,184,122,0.2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:visible;margin-bottom:1rem}
.card-clip{overflow:hidden}
.card-p{padding:1.25rem}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.9rem 1.1rem}
.ml{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.mv{font-size:22px;font-weight:600;font-family:'DM Mono',monospace}
.ms{font-size:11px;color:var(--text3);margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
#shell{display:flex;height:100vh;position:relative}
#sidebar{width:225px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s ease;z-index:100}
.sb-brand{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.sb-brand-logo{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.1em;font-family:'DM Mono',monospace}
.sb-brand-sub{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.04em}
.sb-store{padding:.75rem 1.25rem;border-bottom:1px solid var(--border)}
.sb-store-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.sb-store select{background:var(--surface2);font-size:12px;padding:6px 10px}
.sb-nav{flex:1;overflow-y:auto;padding:.75rem 0}
.sb-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:.5rem 1.25rem .25rem;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:.55rem 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:all .12s}
.sb-item:hover{color:var(--text);background:var(--surface2)}
.sb-item.active{color:var(--accent);background:rgba(212,168,67,.08);border-left-color:var(--accent)}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.sb-user{padding:1rem 1.25rem;border-top:1px solid var(--border)}
.sb-user-name{font-size:13px;font-weight:500}
.sb-user-role{font-size:11px;color:var(--text3);margin-top:1px}
.sb-signout{margin-top:10px;width:100%;font-size:12px;padding:6px 12px}
#main{flex:1;overflow-y:auto;padding:2rem;transition:margin 0.2s ease}
#main>*{max-width:960px;margin-left:auto;margin-right:auto}
.page-title{font-size:20px;font-weight:600;margin-bottom:.25rem}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:1rem}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{width:100%;max-width:400px;padding:1rem;display:flex;flex-direction:column;align-items:stretch}
.login-logo{font-size:42px;font-weight:700;color:var(--accent);letter-spacing:.12em;font-family:'DM Mono',monospace;text-align:center;margin-bottom:0.25rem}
.login-tagline{text-align:center;font-size:13px;color:var(--text3);margin-bottom:2rem;letter-spacing:.04em}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem}
.login-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.login-field{margin-bottom:1.25rem}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.5rem 0 .75rem}
.info-box{background:var(--blue-bg);border:1px solid rgba(74,144,217,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--blue-text)}
.warn-box{background:var(--amber-bg);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--amber-text)}
.danger-box{background:var(--red-bg);border:1px solid rgba(224,82,82,.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red-text)}
.ai{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.ai:last-child{border-bottom:none}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:rgba(212,168,67,.15);color:var(--accent)}
.quick-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1rem;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.quick-card:hover{background:var(--surface3);border-color:var(--accent);transform:translateY(-2px)}
.quick-card:active{transform:scale(.97)}
.quick-icon{font-size:24px;margin-bottom:6px}
.quick-label{font-weight:600;font-size:14px;margin-bottom:2px}
.quick-desc{font-size:11px;color:var(--text3)}
.ov-quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.ov-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.kpi-hero{grid-column:span 2;position:relative;overflow:hidden;cursor:pointer}
.kpi-hero::after{content:"📦";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.04;pointer-events:none}
.draft-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.draft-card:hover{background:var(--surface3);border-color:var(--accent)}
.draft-card .draft-items{display:none;margin-top:10px;background:var(--surface);border-radius:var(--radius);padding:8px 12px}
#mob-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;font-size:20px;line-height:1;cursor:pointer;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:8px 18px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#app-footer{position:fixed;bottom:0;left:225px;right:0;height:36px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:.06em;z-index:50}
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);max-width:500px;width:90%;padding:1.5rem;box-shadow:0 20px 35px -10px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto}
.modal-card h3{font-size:18px;font-weight:600;margin-bottom:1rem;letter-spacing:-0.02em;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0 6px}
.bulk-item-row{display:flex;gap:8px;margin-bottom:6px}
.bulk-item-row select,.bulk-item-row input{font-size:12px;padding:6px 8px}
.profile-modal{min-width:300px;max-width:340px}
.cap-words{text-transform:capitalize}
.profile-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1rem}
.profile-tab{flex:1;padding:8px 0;font-size:12px;font-weight:500;text-align:center;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.profile-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.profile-pane{display:none}.profile-pane.active{display:block}
.dot-menu-wrap{position:relative;display:inline-block;overflow:visible}
.dot-btn{background:none;border:none;color:var(--text3);padding:4px 10px;font-size:18px;cursor:pointer;border-radius:var(--radius);transition:all .15s;line-height:1}
.dot-btn:hover{background:var(--surface3);color:var(--text)}
.dot-dropdown{position:absolute;right:0;top:calc(100% + 5px);background:var(--surface);border:1px solid var(--border2);border-radius:10px;min-width:148px;max-width:190px;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.5);overflow:hidden;padding:4px}
.dot-dropdown button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 11px;background:none;border:none;border-radius:7px;color:var(--text);font-size:12.5px;font-weight:400;line-height:1.3;transition:background .1s;cursor:pointer;white-space:nowrap}
.dot-dropdown button:hover{background:var(--surface2)}
.dot-dropdown .menu-divider{height:1px;background:var(--border);margin:3px 4px}
.dot-dropdown .menu-danger{color:var(--red-text)!important}
.dot-dropdown .menu-icon{font-size:13px;width:17px;text-align:center;flex-shrink:0;opacity:.85}
.stock-qty-big{font-size:36px;font-weight:700;font-family:'DM Mono',monospace}
.stock-detail-row{display:flex;gap:12px;margin-top:12px}
.stock-detail-cell{flex:1;text-align:center;background:var(--surface2);border-radius:var(--radius);padding:6px}
.bar-wrap-lg{background:var(--surface3);border-radius:5px;height:8px;position:relative;margin:8px 0}
.bar-fill-lg{height:100%;border-radius:5px}
.reorder-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(192,57,43,.8)}
.conf-detail.hidden{display:none}
@media(max-width:640px){
  #mob-toggle{display:flex;align-items:center}
  #sidebar{position:fixed;left:0;top:0;height:100vh;width:0;overflow-x:hidden;transition:width 0.2s ease;z-index:150}
  #sidebar.open{width:250px;box-shadow:4px 0 24px rgba(0,0,0,.6)}
  #main{padding:1rem;padding-top:56px;width:100%}
  .ov-quick-grid{gap:8px}
  .quick-card{padding:0.75rem}
  .quick-icon{font-size:20px}
  .quick-label{font-size:12px}
  .ov-kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-hero{grid-column:span 2}
  .mv{font-size:18px!important}
  .fr{grid-template-columns:1fr!important}
  #app-footer{left:0!important}
  .bulk-item-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">BSG</div>
    <div class="login-tagline">Inventory Management System</div>
    <div class="login-card">
      <div class="login-field"><label class="login-label">Username</label><input type="text" id="lu" placeholder="Enter your username" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="login-field"><label class="login-label">Password</label><input type="password" id="lp" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="lerr" style="color:var(--red-text);font-size:12px;margin-bottom:14px;display:none"></div>
      <button class="primary" style="width:100%;padding:10px" onclick="doLogin()">Sign in</button>
    </div>
    <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:1.25rem;font-family:'DM Mono',monospace;letter-spacing:.06em">BSG &middot; Inventory Desk &copy; 2026</div>
  </div>
</div>

<button id="mob-toggle" onclick="toggleSidebar()" style="display:none">☰</button>
<div id="toast"></div>
<div id="shell" class="hidden" style="visibility:hidden">
<div id="global-modal" class="hidden" style="position:fixed;inset:0;z-index:999"></div>
  <div id="sidebar">
    <div class="sb-brand"><div class="sb-brand-logo">BSG</div><div class="sb-brand-sub">Inventory Desk</div></div>
    <div class="sb-store" id="store-switcher"><div class="sb-store-label">Store view</div><select id="store-select" onchange="setStore(this.value)"><option value="all">All stores</option><option value="s1">Alliance1 Stores</option><option value="s2">JTI Stores</option><option value="s3">Area 10 Store</option></select></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user">
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
    <div id="sb-ava" class="ava"></div>
    <div style="flex:1;min-width:0">
      <div id="sb-uname" class="sb-user-name"></div>
      <div id="sb-urole" class="sb-user-role"></div>
    </div>

  </div>
  <button class="sb-signout" style="width:100%" onclick="doLogout()">Sign out</button>
</div>
  </div>
  <div id="main"><div id="pg-overview" class="fade-in"></div><div id="pg-stock" class="hidden fade-in"></div><div id="pg-receive" class="hidden fade-in"></div><div id="pg-issue" class="hidden fade-in"></div><div id="pg-reorder" class="hidden fade-in"></div><div id="pg-products" class="hidden fade-in"></div><div id="pg-history" class="hidden fade-in"></div><div id="pg-reports" class="hidden fade-in"></div><div id="pg-users" class="hidden fade-in"></div><div id="pg-admin" class="hidden fade-in"></div><div id="pg-activitylog" class="hidden fade-in"></div><div id="pg-security" class="hidden fade-in"></div></div>
</div>

<script>

// ---------- CONSTANTS & GLOBALS ----------
const STORES = { s1:{name:"Alliance1 Stores",short:"A1"}, s2:{name:"JTI Stores",short:"JTI"}, s3:{name:"Area 10 Store",short:"A10"} };
const CATS = ["Grains & Cereals","Dairy & Eggs","Fruits & Veg","Beverages","Cooking Oils","Snacks & Confec.","Cleaning & Hygiene","Other"];
const DEFAULT_DESTINATIONS = [{id:"d1",name:"Kitchen",store:null},{id:"d2",name:"Restaurant",store:null},{id:"d3",name:"Bar",store:"s3"},{id:"d4",name:"Sold (retail)",store:null},{id:"d5",name:"Damaged / waste",store:null},{id:"d6",name:"Staff consumption",store:null},{id:"d7",name:"Other",store:null}];
const DEFAULT_PRODUCTS = [];
const DEFAULT_STOCK = { s1:{}, s2:{}, s3:{} };
const DEFAULT_USERS = [{id:"admin",name:"Administrator",role:"admin",store:null,password:"YnNnOjoyMDI2",active:true},{id:"a1_staff",name:"Alliance1 Staff",role:"staff",store:"s1",password:"YnNnOjoyMDI2",active:true},{id:"jti_staff",name:"JTI Staff",role:"staff",store:"s2",password:"YnNnOjoyMDI2",active:true},{id:"a10_staff",name:"Area 10 Staff",role:"staff",store:"s3",password:"YnNnOjoyMDI2",active:true},{id:"manager",name:"Store Manager",role:"manager",store:null,password:"YnNnOjoyMDI2",active:true}];
let DB = {users:[],products:[],stock:{s1:{},s2:{},s3:{}},receipts:[],issuances:[],movements:[],destinations:[],activityLog:[],userMemory:{},transfers:[],settings:{showAlerts:true,showStockStatus:true,showStockBar:true,showOverviewKPIs:true}};
let onlineUsers = {}; // {uid: lastSeenTimestamp}
let CU=null, CS="all", CP="overview", stockSearchTerm="", productSearchTerm="", issLines=[], issDestId=null, idCounter=1000;

// Helpers
function skuKey(sku){return sku.replace(/-/g,"");}

// ── Smart inline item row (no labels) ──
function itemRow(l, accentColor){
  const p = getProd(l.sku);
  const unit = l.unit || p.unit || '';
  const total = l.lineVal || (l.qty * l.cost);
  const color = accentColor || 'var(--text)';
  return `<div style="display:grid;grid-template-columns:1fr 52px 52px 90px 90px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.name}</span>
    <span style="font-family:'DM Mono';text-align:right;color:var(--text2)">${l.qty}</span>
    <span style="color:var(--text3);font-size:11px">${unit}</span>
    <span style="font-family:'DM Mono';text-align:right;color:var(--text2)">${fmt(l.cost)}</span>
    <span style="font-family:'DM Mono';text-align:right;font-weight:600;color:${color}">${fmt(total)}</span>
  </div>`;
}
function capWords(s){ if(!s)return s; return s.replace(/(^|\s)\S/g, c=>c.toUpperCase()); }
function capInput(el){ const pos=el.selectionStart; el.value=capWords(el.value); try{el.setSelectionRange(pos,pos);}catch(e){} }
// Global auto-capitalize: fires on all text inputs except username/password
document.addEventListener("input", function(e){
  const el=e.target;
  if(el.tagName!=="INPUT"&&el.tagName!=="TEXTAREA") return;
  if(el.type==="password"||el.type==="number"||el.type==="date") return;
  if(["lu","uid","newpwd","upwd","cp_current","cp_new","cp_confirm"].includes(el.id)) return;
  if(el.classList.contains("no-cap")) return;
  const pos=el.selectionStart;
  const newV=(el.value||"").replace(/(^|\s)\S/g, c=>c.toUpperCase());
  if(newV!==el.value){ el.value=newV; try{el.setSelectionRange(pos,pos);}catch(e){} }
});

// ══ Per-user autocomplete memory (persisted in DB) ══
function _acKey(){ return CU||'guest'; }
function _acGet(field){ return (DB.userMemory?.[_acKey()]?.[field])||[]; }
function _acSave(field,val){
  if(!val||!val.trim()||!CU) return;
  val=val.trim();
  if(!DB.userMemory) DB.userMemory={};
  if(!DB.transfers) DB.transfers=[];
  if(!DB.userMemory[_acKey()]) DB.userMemory[_acKey()]={};
  let arr=DB.userMemory[_acKey()][field]||[];
  arr=arr.filter(v=>v.toLowerCase()!==val.toLowerCase()); // dedup
  arr.unshift(val);
  DB.userMemory[_acKey()][field]=arr.slice(0,25); // keep last 25
  // debounced save — don't hammer DB on every keystroke
  clearTimeout(window._acSaveTimer);
  window._acSaveTimer=setTimeout(()=>saveDB(),2000);
}
function rememberField(field,val){ _acSave(field,val); }
function _recall(field){ const arr=_acGet(field); return arr[0]||''; }
function recallField(id){ 
  const el=document.getElementById(id); if(!el)return;
  if(el.tagName==='SELECT'){ const v=_recall(id); if(v) el.value=v; }
}

function acInput(el,field){
  const val=el.value;
  _showAcDrop(el,field,val);
}
function _showAcDrop(el,field,q){
  const ddId='ac_dd_'+field;
  let dd=document.getElementById(ddId);
  const arr=_acGet(field);

async function _sbReq(method, path, body=null){
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      method,
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer '+SUPABASE_ANON_KEY,

      },

    if(!res.ok){ console.warn('Supabase '+method+' failed:', res.status, await res.text()); return null; }

  } catch(e){ console.warn('Supabase offline:', e.message); return null; }

async function loadDB(){
  let loaded = false;
  // 1. Try Supabase
  try{
    const rows = await _sbReq('GET', SUPABASE_TABLE+'?id=eq.bsg_main&select=data&limit=1');
    if(rows && rows.length && rows[0].data){
      const p = JSON.parse(rows[0].data);
      DB = p.db || p;
      if(p.idCounter) idCounter = p.idCounter;
      if(DB.storeList) DB.storeList.forEach(s=>{ STORES[s.key]=s.val; if(!DB.stock[s.key]) DB.stock[s.key]={}; });
      loaded = true;
    }
  }catch(e){ console.warn('Supabase load error:', e); }
  // 2. Local storage fallback
  if(!loaded){
    try{
      const r = await window.storage.get('bsg_ims_v4');
      if(r && r.value){
        const p = JSON.parse(r.value);
        DB = p.db || p;
        if(p.idCounter) idCounter = p.idCounter;
        if(DB.storeList) DB.storeList.forEach(s=>{ STORES[s.key]=s.val; if(!DB.stock[s.key]) DB.stock[s.key]={}; });

      }
    }catch(e){}

  // 3. First run — seed defaults
  if(!DB.users || !DB.users.length) DB.users = JSON.parse(JSON.stringify(DEFAULT_USERS));

// ---------- STOCK ----------
function renderStock(){ 
  let stock=getVisibleStock(); if(stockSearchTerm){const t=stockSearchTerm.toLowerCase();stock=stock.filter(i=>i.name.toLowerCase().includes(t)||(i.cat||"").toLowerCase().includes(t));} 
  const showS=CS==="all"; const rows=stock.map(i=>{ const p=pct(i.qty||0,i.max||1); const st=stStatus(i); const rp=pct(i.reorder,i.max||1); const sc=st==="s"?"var(--green-text)":st==="low"?"var(--amber-text)":"var(--red-text)"; const sbadge=getSetting('showStockStatus',true)?(st==="s"?'<span class="badge bg">Good</span>':st==="low"?'<span class="badge bw">Low</span>':st==="critical"?'<span class="badge bd">Critical</span>':'<span class="badge bd">Out</span>'):'' ; const pd=JSON.stringify({name:i.name,sku:i.sku,store:i.store,qty:i.qty||0,cost:i.cost,value:(i.qty||0)*(i.cost||0),unit:i.unit,reorder:i.reorder,max:i.max,cat:i.cat}).replace(/'/g,"&#39;"); return `<tr onclick="showStockValueModal(JSON.parse(this.querySelector('.__pd').dataset.pd))" style="cursor:pointer"><td><span class="__pd" data-pd='${pd}' style="display:none"></span><div style="font-weight:500">${i.name}</div><div style="font-size:10px;color:var(--text3);margin-top:1px">${showS?(STORES[i.store]?.short||i.store)+" · ":""}${i.cat}</div></td><td style="min-width:140px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:15px;font-weight:700;font-family:'DM Mono';color:${sc}">${i.qty||0} <span style="font-size:10px;font-weight:400;color:var(--text3)">${i.unit}s</span></span><span style="font-size:10px;color:var(--text3)">${p}%</span></div>${getSetting('showStockBar',true)?`<div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;position:relative"><div style="height:100%;width:${p}%;background:${barC(p)};border-radius:4px;transition:width .4s"></div><div style="position:absolute;top:0;bottom:0;left:${rp}%;width:2px;background:rgba(192,57,43,.7)"></div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:2px"><span>0</span><span style="color:var(--red-text)">↑${i.reorder}</span><span>${i.max}</span></div>`:""}</td><td style="text-align:right">${sbadge}</td></tr>`; }).join(""); 
  document.getElementById("pg-stock").innerHTML=`<div class="page-title">Stock levels</div><div class="page-sub">${CS==="all"?"All stores":STORES[CS]?.name}</div>${renderMetrics()}<div style="display:flex;gap:8px;margin-bottom:.5rem;align-items:center"><div style="position:relative;flex:1"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none">🔍</span><input type="text" id="stockSearchInput" style="padding-left:32px" placeholder="Search products…" value="${stockSearchTerm.replace(/"/g,"&quot;")}" oninput="liveStockSearch(this.value)"></div><button onclick="exportStockCSV()" style="padding:8px 12px;font-size:12px;white-space:nowrap;flex-shrink:0">📥 CSV</button></div><div class="card"><table><thead><tr><th>Product</th><th style="min-width:140px">Level</th><th style="text-align:right">Status</th></tr></thead><tbody>${rows||`<tr><td colspan="3" style="padding:20px;text-align:center;color:var(--text3)">No products found</td></tr>`}</tbody></table></div><div id="valueModal"></div>`; 
}
function liveStockSearch(v){ stockSearchTerm=v; clearTimeout(window._stockSearchTimer); window._stockSearchTimer=setTimeout(()=>{
  renderStock();
  const el=document.getElementById('stockSearchInput'); if(el){el.focus();const l=v.length;el.setSelectionRange(l,l);}
},150); }
function showStockValueModal(p){ 
  const container=document.getElementById("valueModal") || (()=>{const d=document.createElement("div");d.id="valueModal";document.body.appendChild(d);return d;})(); const levelPct=pct(p.qty,p.max||1); const st=p.qty===0?"out":p.qty<=p.reorder?"critical":levelPct<30?"low":"s"; const statusColor=st==="s"?"var(--green-text)":st==="low"?"var(--amber-text)":"var(--red-text)"; const reorderPct=pct(p.reorder,p.max||1); 
  container.innerHTML=`<div class="modal-mask" onclick="closeStockModal()"><div class="modal-card" onclick="event.stopPropagation()" style="max-width:400px"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem"><div><div style="font-size:18px;font-weight:600">${p.name}</div><div style="font-size:12px;color:var(--text3);margin-top:2px">${p.sku} · ${p.cat||""} · ${STORES[p.store]?.name||p.store}</div></div><button onclick="closeStockModal()" style="background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:0 4px">✕</button></div><div style="text-align:center;padding:1.25rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:1rem"><div class="stock-qty-big" style="color:${statusColor}">${p.qty}</div><div style="font-size:13px;color:var(--text3)">${p.unit}s on hand</div><div style="margin:10px 0"><div class="bar-wrap-lg"><div class="bar-fill-lg" style="width:${levelPct}%;background:${barC(levelPct)}"></div><div class="reorder-marker" style="left:${reorderPct}%"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3)"><span>0</span><span style="color:var(--red-text)">Reorder: ${p.reorder}</span><span>Max: ${p.max}</span></div></div></div><div class="stock-detail-row"><div class="stock-detail-cell"><div class="stock-detail-val">${fmt(p.cost)}</div><div class="stock-detail-lbl">Unit cost</div></div><div class="stock-detail-cell"><div class="stock-detail-val">${fmt(p.value)}</div><div class="stock-detail-lbl">Total value</div></div><div class="stock-detail-cell"><div class="stock-detail-val">${levelPct}%</div><div class="stock-detail-lbl">Capacity</div></div></div><button class="primary" style="width:100%;margin-top:1rem" onclick="closeStockModal()">Close</button></div></div>`; 
}
function closeStockModal(){ document.getElementById("valueModal").innerHTML=""; }
function renderMetrics(){ const stock=getVisibleStock(); const val=stock.reduce((a,i)=>a+(i.qty||0)*(i.cost||0),0); const crit=stock.filter(i=>["critical","out"].includes(stStatus(i))).length; const low=stock.filter(i=>stStatus(i)==="low").length; return `<div class="metrics"><div class="metric"><div class="ml">Stock value</div><div class="mv">${fmt(val)}</div><div class="ms">${stock.reduce((a,i)=>a+(i.qty||0),0)} units</div></div><div class="metric"><div class="ml">Total received</div><div class="mv">${fmt(DB.receipts.filter(r=>getKeys().includes(r.store)&&r.confirmed).reduce((a,r)=>a+r.total,0))}</div><div class="ms">confirmed</div></div><div class="metric"><div class="ml">Total issued</div><div class="mv">${fmt(DB.issuances.filter(r=>getKeys().includes(r.store)&&r.confirmed).reduce((a,r)=>a+r.total,0))}</div><div class="ms">confirmed</div></div><div class="metric"><div class="ml">Critical/out</div><div class="mv" style="color:var(--red-text)">${crit}</div><div class="ms">need reorder</div></div><div class="metric"><div class="ml">Low stock</div><div class="mv" style="color:var(--amber-text)">${low}</div><div class="ms">below 30%</div></div></div>`; }
function exportStockCSV(){ 
  const stock=getVisibleStock(); const rows=[["Product","SKU","Category","Store","Qty","Unit","Reorder","Max","Status","Unit Cost","Value"]]; 
  stock.forEach(i=>{ const st=stStatus(i); rows.push([i.name,i.sku,i.cat,STORES[i.store]?.name||i.store,i.qty||0,i.unit,i.reorder,i.max,st==="s"?"In Stock":st==="critical"?"Critical":st==="low"?"Low":"Out",i.cost||0,(i.qty||0)*(i.cost||0)]); }); 
  downloadCSV(rows,"stock_levels_"+todayVal());
}
function downloadCSV(rows,filename){ const csv=rows.map(r=>r.map(c=>{const s=String(c);return(s.includes(",")||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\n"); const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename+".csv";a.click(); }

function renderReceive(){ 
  const ud=currentUser(); const useStore=(ud.role==="staff"||ud.role==="clerk"||ud.role==="supervisor")?ud.store:CS; const storeName=useStore==="all"?"All stores":(STORES[useStore]?.name||useStore); const showActions=useStore!=="all";
  const drafts=useStore==="all"?[]:DB.receipts.filter(r=>r.store===useStore&&!r.confirmed);
  const from=window.receiveFrom||getMonthStart(); const to=window.receiveTo||todayVal(); window.receiveFrom=from; window.receiveTo=to;
  const confirmedAll=DB.receipts.filter(r=>{ if(!r.confirmed) return false; if(useStore==="all") return getKeys().includes(r.store); return r.store===useStore; }).filter(r=>r.date>=from&&r.date<=to).sort((a,b)=>b.date.localeCompare(a.date));
  const dH=drafts.length===0?`<div style="padding:16px 14px;color:var(--text3);text-align:center">No pending drafts</div>`:drafts.map(r=>{ const itemsHtml=r.items.map(l=>itemRow(l,'var(--green-text)')).join(''); return `<div class="draft-card" onclick="toggleDraftItems(this,event)"><div style="display:flex;gap:10px"><div style="flex:1"><div style="font-weight:600">GRN-${r.id} — ${r.supplier}</div><div style="font-size:11px;color:var(--text3)">${r.date} · ${r.items.length} items · ${fmt(r.total)}</div></div><div style="display:flex;gap:5px"><button style="font-size:12px;padding:5px 10px;color:var(--accent)" onclick="event.stopPropagation();editReceiptDraft(${r.id})">✎</button><button class="success" style="font-size:12px;padding:5px 14px" onclick="event.stopPropagation();confirmReceipt(${r.id})">✓</button><button style="font-size:12px;color:var(--red-text);padding:5px 10px" onclick="event.stopPropagation();delReceipt(${r.id})">✕</button></div></div><div class="draft-items">${itemsHtml}<div style="display:flex;justify-content:space-between;padding-top:7px;font-weight:700"><span>Total</span><span style="font-family:'DM Mono'">${fmt(r.total)}</span></div></div></div>`;}).join("");
  const cH=confirmedAll.length===0?`<div style="padding:16px 14px;color:var(--text3);text-align:center">No confirmed receipts</div>`:confirmedAll.map(r=>{ const itemsHtml=r.items.map(l=>itemRow(l,'var(--green-text)')).join(''); return `<div class="draft-card" onclick="toggleDraftItems(this,event)"><div style="display:flex;gap:10px"><div style="flex:1"><div style="font-weight:600">GRN-${r.id} — ${r.supplier}</div><div style="font-size:11px;color:var(--text3)">${STORES[r.store]?.name||r.store} · ${r.date} · ${r.items.length} items</div><div style="font-size:10px;color:var(--green-text)">✓ Confirmed by ${r.confirmedBy||''} ${r.confirmedAt||''}</div></div><span style="font-family:'DM Mono';font-weight:600;color:var(--green-text)">${fmt(r.total)}</span></div><div class="draft-items">${itemsHtml}<div style="display:flex;justify-content:space-between;padding-top:7px;font-weight:700"><span>Total</span><span style="font-family:'DM Mono'">${fmt(r.total)}</span></div></div></div>`;}).join("");
  document.getElementById("pg-receive").innerHTML=`
    <div class="page-title">Receive goods</div><div class="page-sub">${storeName}</div>
    ${showActions?`<div style="display:flex;gap:8px;margin-bottom:1.25rem"><button class="primary" onclick="openReceiveModal('${useStore}','single')">＋ Add received item</button><button onclick="openReceiveModal('${useStore}','bulk')">📦 Bulk receive</button></div>`:`<div class="warn-box">Select a specific store to add receipts.</div>`}
    ${showActions?`${renderPendingTransfers(useStore)}<div class="sl">Pending drafts (${drafts.length})</div><div class="card">${dH}</div>`:''}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:.5rem"><div class="sl" style="margin:0">Confirmed (${confirmedAll.length})</div><input type="date" id="recFrom" value="${from}" style="width:130px"><span>to</span><input type="date" id="recTo" value="${to}" style="width:130px"><button onclick="applyReceiveDateFilter()">Apply</button></div>
    <div class="card">${cH}</div>`;
}

function bulkSearchProd(el, rowId, store){
  const q=el.value.toLowerCase();
  const dd=document.getElementById(rowId+'_dd');
  if(!dd)return;
  const matches=q ? DB.products.filter(p=>p.name.toLowerCase().includes(q)) : DB.products;
  if(!matches.length){ dd.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--text3)">No products</div>'; dd.style.display='block'; return; }
  dd.innerHTML=matches.slice(0,8).map(p=>`
    <div onclick="pickBulkProd('${rowId}','${p.sku}','${p.name.replace(/'/g,"\'")}',${p.cost||0})"
      style="padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"
      onmouseover="this.style.background='var(--surface3)'" onmouseout="this.style.background=''">
      <span>${p.name}</span><span style="font-family:'DM Mono';color:var(--text3)">${fmt(p.cost)}</span>
    </div>`).join('');
  dd.style.display='block';
  setTimeout(()=>{ document.addEventListener('click',function _c(e){ if(!dd.contains(e.target)&&e.target!==el){ dd.style.display='none'; document.removeEventListener('click',_c); } }); },50);
}

function pickBulkProd(rowId,sku,name,cost){
  const s=document.getElementById(rowId+'_search'); if(s) s.value=name;

async function saveTransfer(fromStore){
  if(!issLines.length){ const e=document.getElementById('tr-err'); if(e){e.textContent='Add at least one item.';e.style.display='block';} return; }
  const toStore=document.getElementById('tr_to_store').value;

  // Check stock availability
  for(let l of issLines){ const avail=getSR(fromStore,l.sku).qty||0; if(avail<l.qty){ showToast(`Insufficient stock for ${l.name}`,'warn'); return; } }
  const tr={id:nextId(),fromStore,toStore,date,items:issLines.map(l=>({sku:l.sku,name:l.name,qty:l.qty,cost:l.cost,lineVal:l.lineVal})),total:issLines.reduce((a,l)=>a+l.lineVal,0),status:'pending',createdBy:CU,createdAt:nowTs()};
  DB.transfers.push(tr);
  issLines=[];
  await saveDB(); closeModal(); renderIssue();

async function confirmTransfer(id){
  const t=DB.transfers.find(x=>x.id===id); if(!t||t.status!=='pending')return;
  showConfirm(`Accept transfer from ${STORES[t.fromStore]?.name}?`, async()=>{
    // Deduct from sender
    for(let l of t.items){
      const key=skuKey(l.sku);
      if(!DB.stock[t.fromStore][key])DB.stock[t.fromStore][key]={qty:0,reorder:10,max:100};
      DB.stock[t.fromStore][key].qty=Math.max(0,(DB.stock[t.fromStore][key].qty||0)-l.qty);
      DB.movements.push({id:nextId(),store:t.fromStore,sku:l.sku,type:'transfer-out',change:-l.qty,after:DB.stock[t.fromStore][key].qty,ref:`TRF-${t.id}`,by:CU,ts:nowTs()});
      // Add to receiver
      if(!DB.stock[t.toStore][key])DB.stock[t.toStore][key]={qty:0,reorder:10,max:100};
      DB.stock[t.toStore][key].qty=Math.min(DB.stock[t.toStore][key].max||999,(DB.stock[t.toStore][key].qty||0)+l.qty);
      DB.movements.push({id:nextId(),store:t.toStore,sku:l.sku,type:'transfer-in',change:l.qty,after:DB.stock[t.toStore][key].qty,ref:`TRF-${t.id}`,by:CU,ts:nowTs()});
    }
    t.status='confirmed'; t.confirmedBy=CU; t.confirmedAt=nowTs();
    logActivity(CU,'transfer',`Accepted transfer TRF-${t.id} from ${STORES[t.fromStore]?.name}`);
    await saveDB(); renderReceive(); showToast('Transfer accepted — stock updated','ok');
  },'Accept','success');
}

async function rejectTransfer(id){
  const t=DB.transfers.find(x=>x.id===id); if(!t)return;
  showConfirm(`Reject transfer from ${STORES[t.fromStore]?.name}?`, async()=>{
    t.status='rejected'; t.rejectedBy=CU; t.rejectedAt=nowTs();
    await saveDB(); renderReceive(); showToast('Transfer rejected','warn');
  },'Reject','danger');
}

async function confirmReceipt(id){ 
  const r=DB.receipts.find(x=>x.id===id); if(!r||r.confirmed)return; 
  showConfirm(`Confirm GRN-${r.id}?`, async ()=>{ for(let l of r.items){ const key=skuKey(l.sku); if(!DB.stock[r.store][key]) DB.stock[r.store][key]={qty:0,reorder:10,max:100}; const sr=DB.stock[r.store][key]; sr.qty=Math.min(sr.max,sr.qty+l.qty); DB.movements.push({id:nextId(),store:r.store,sku:l.sku,type:'receive',change:l.qty,after:sr.qty,ref:`GRN-${r.id}`,by:CU,ts:nowTs()}); } r.confirmed=true; r.confirmedBy=CU; r.confirmedAt=nowTs(); logActivity(CU,'receive',`Confirmed GRN-${r.id} (${STORES[r.store]?.name})`); await saveDB(); renderReceive(); showToast('Receipt confirmed','ok'); },'confirm','success');
}
async function delReceipt(id){ const idx=DB.receipts.findIndex(r=>r.id===id); if(idx>-1&&!DB.receipts[idx].confirmed){ DB.receipts.splice(idx,1); await saveDB(); renderReceive(); showToast('Draft deleted','warn'); } }

  issLines=[]; await saveDB(); closeModal(); renderIssue(); showToast('Draft saved','ok');

async function confirmIssue(id){ const r=DB.issuances.find(x=>x.id===id); if(!r||r.confirmed)return; for(let l of r.items){ const avail=getSR(r.store,l.sku).qty||0; if(avail<l.qty){ showToast(`Insufficient stock for ${l.name}`,'warn'); return; } } showConfirm(`Confirm ISS-${r.id}?`, async ()=>{ for(let l of r.items){ const key=skuKey(l.sku); const sr=DB.stock[r.store][key]; sr.qty=Math.max(0,sr.qty-l.qty); DB.movements.push({id:nextId(),store:r.store,sku:l.sku,type:'issue',change:-l.qty,after:sr.qty,ref:`ISS-${r.id}`,destination:r.destination,by:CU,ts:nowTs()}); } r.confirmed=true; r.confirmedBy=CU; r.confirmedAt=nowTs(); logActivity(CU,'issue',`Confirmed ISS-${r.id} → ${r.destination}`); await saveDB(); renderIssue(); showToast('Issue confirmed','ok'); },'confirm','success'); }
async function delIssue(id){ const idx=DB.issuances.findIndex(r=>r.id===id); if(idx>-1&&!DB.issuances[idx].confirmed){ DB.issuances.splice(idx,1); await saveDB(); renderIssue(); showToast('Draft deleted','warn'); } }

function showConfirm(msg, onYes, yesLabel='Confirm', yesClass='primary', detail=''){
  window._confirmCb = onYes;
  const isDanger = yesClass === 'danger';
  const isSuccess = yesClass === 'success';
  const color = isDanger ? 'var(--red-text)' : isSuccess ? 'var(--green-text)' : 'var(--blue-text)';
  const bg = isDanger ? 'rgba(192,57,43,0.15)' : isSuccess ? 'rgba(61,184,122,0.15)' : 'rgba(74,144,217,0.15)';
  const icon = isDanger
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
    : isSuccess
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
  const heading = isDanger ? 'Are you sure?' : isSuccess ? 'Confirm' : 'Notice';
  const btnLabel = isDanger ? 'Yes, delete' : (yesLabel === 'ok' ? 'Got it' : yesLabel);
  const isInfoOnly = yesLabel === 'ok';
  // Use same overlay approach as discard — consistent size & style
  const overlay=document.createElement('div');
  overlay.id='confirm-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center';
  overlay.innerHTML=`<div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.5rem;max-width:360px;width:90%;box-shadow:0 20px 40px rgba(0,0,0,.5);text-align:center">
      <div style="width:60px;height:60px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;border:1px solid ${color}33">${icon}</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:.4rem">${heading}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:${detail ? '.5rem' : '1.25rem'}">${msg}</div>
      ${detail ? `<div style="font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:1.25rem;line-height:1.5;text-align:left">${detail}</div>` : ''}
      <div style="display:flex;gap:10px">
        ${isInfoOnly ? '' : `<button style="flex:1;padding:10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px" onclick="document.getElementById('confirm-overlay').remove()">Cancel</button>`}
        <button class="${isInfoOnly ? 'primary' : yesClass}" style="flex:1;padding:10px;border-radius:var(--radius);font-weight:600;font-size:13px;cursor:pointer" onclick="document.getElementById('confirm-overlay').remove();if(window._confirmCb){const cb=window._confirmCb;window._confirmCb=null;cb();}">${btnLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function doChangeMyPassword(){
  const current = document.getElementById('cp_current')?.value;
  const newPwd  = document.getElementById('cp_new')?.value?.trim();
  const confirm = document.getElementById('cp_confirm')?.value?.trim();
  const errEl   = document.getElementById('cp_err');
  const user    = DB.users.find(x => x.id === CU);

  if(!user){ errEl.textContent="User not found."; errEl.style.display="block"; return; }
  if(!checkPwd(current, user.password)){ errEl.textContent="Current password is incorrect."; errEl.style.display="block"; return; }
  if(!newPwd || newPwd.length < 4){ errEl.textContent="New password must be at least 4 characters."; errEl.style.display="block"; return; }
  if(newPwd !== confirm){ errEl.textContent="Passwords do not match."; errEl.style.display="block"; return; }
  if(checkPwd(newPwd, user.password)){ errEl.textContent="New password must be different from current."; errEl.style.display="block"; return; }

  user.password = hashPwd(newPwd);
  logActivity(CU, 'pwd_change', 'Changed their password');
  await saveDB();
  closeModal();
  showToast('Password updated successfully ✓', 'ok');
}

async function addProductFromModal(){
  const name = document.getElementById('m_pname').value.trim();
  const cat  = document.getElementById('m_pcat').value;
  const unit = document.getElementById('m_punit').value.trim();
  const cost = parseInt(document.getElementById('m_pcost').value)||0;
  const errDiv = document.getElementById('m_perr');
  if(!name||!unit){ errDiv.textContent='Name and unit are required.'; errDiv.style.display='block'; return; }
  if(DB.products.find(p=>p.name.toLowerCase()===name.toLowerCase())){ errDiv.textContent='A product with this name already exists.'; errDiv.style.display='block'; return; }

  const prefix=cat.slice(0,2).toUpperCase();
  let sku=`${prefix}-${(DB.products.length+1).toString().padStart(3,'0')}`;
  while(DB.products.find(p=>p.sku===sku)){ sku=`${prefix}-${(Math.floor(Math.random()*900)+100)}`; }
  DB.products.push({sku,name,cat,unit,cost,createdBy:CU,createdAt:todayVal()});
  const key=skuKey(sku);
  Object.keys(STORES).forEach(s=>{ if(!DB.stock[s])DB.stock[s]={}; DB.stock[s][key]={qty:0,reorder:10,max:100}; });
  await saveDB(); closeModal(); renderProducts(); showToast('Product added','ok');
  if(CP==="stock") renderStock();
}

  }
  const isDirector = currentUser().role==="director";
  const visibleLog = isDirector ? DB.activityLog.filter(e=>e.uid!=="admin") : DB.activityLog;
  const rows=visibleLog.slice(0,200).map(e=>{
    const u=DB.users.find(x=>x.id===e.uid)||{name:e.uid,role:""};
    const isLog=e.action==="login"; const isOut=e.action==="logout";
    const color=isLog?"var(--green-text)":isOut?"var(--amber-text)":"var(--blue-text)";
    const icon=isLog?"→":isOut?"←":"·";
    return `<div style="display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:12px">
      <span style="color:${color};font-weight:700;width:14px;flex-shrink:0">${icon}</span>
      <div style="flex:1;min-width:0">
        <span style="font-weight:500;color:var(--text)">${u.name}</span>
        <span style="color:var(--text3);margin-left:6px">${e.detail}</span>
      </div>
      <span style="color:var(--text3);flex-shrink:0;font-family:'DM Mono',monospace">${e.ts}</span>
    </div>`;
  }).join("");
  const el=document.getElementById("activity-log-body");
  if(el) el.innerHTML=rows;
}

function renderUsersOnlineStatus(){
  if(!DB.users) return;
  const rows=DB.users.map(u=>{
    const online=isOnline(u.lastSeen);
    const dot=online
      ?`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#3db87a;box-shadow:0 0 5px #3db87a;margin-right:5px"></span>`
      :`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--surface3);margin-right:5px"></span>`;
    const lastSeen=u.lastSeen?`Last seen: ${new Date(u.lastSeen).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}`:"Never";
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px">
      <div style="display:flex;align-items:center;flex:1">${dot}<span style="font-weight:500">${u.name}</span><span style="margin-left:8px;color:var(--text3)">${roleBadge(u.role)}</span></div>
      <span style="color:${online?"var(--green-text)":"var(--text3)"};">${online?"🟢 Online":lastSeen}</span>
    </div>`;
  }).join("");
  const el=document.getElementById("online-status-body");
  if(el) el.innerHTML=rows;
}

function renderPage(){ 
  if(CP==="overview")renderOverview(); else if(CP==="stock")renderStock(); else if(CP==="receive")renderReceive(); else if(CP==="issue")renderIssue(); 
  else if(CP==="reorder")renderReorder(); else if(CP==="products")renderProducts(); else if(CP==="history")renderHistory(); 
  else if(CP==="reports")renderReports(); else if(CP==="users")renderUsers(); else if(CP==="admin")renderAdmin();
  else if(CP==="activitylog")renderActivityLogPage();
  else if(CP==="security")renderSecurityPage();
}

// Auto-restore session on page load
(async function restoreSession(){
  try{
    const s = localStorage.getItem('bsg_session');
    if(!s) return;
    const {uid, cs} = JSON.parse(s);
    await loadDB();
    const user = DB.users.find(u=>u.id===uid&&u.active);
    if(!user){ localStorage.removeItem('bsg_session'); return; }
    CU=uid; CS=(["staff","clerk","supervisor"].includes(user.role))?user.store:(cs||"all");
    try{ const savedCp=localStorage.getItem('bsg_cp'); if(savedCp) CP=savedCp; }catch(e){ CP="overview"; }
    onlineUsers[uid]=Date.now();
    startHeartbeat();
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("shell").classList.remove("hidden");
    document.getElementById("shell").style.visibility="";
    document.getElementById("app-footer").style.display="flex";
    CP="overview"; setupUI(); renderPage();
  }catch(e){ localStorage.removeItem('bsg_session'); }
})();
</script>
