<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Drim Designs · Client Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--surface3:#252830;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0f0;--text2:#9a9da6;--text3:#5a5d68;
  --accent:#d4a843;--accent2:#e8c06a;
  --green:#3db87a;--green-bg:rgba(61,184,122,0.1);--green-text:#5dd49a;
  --amber-bg:rgba(212,168,67,0.1);--amber-text:#e8c06a;
  --red:#c0392b;--red-bg:rgba(192,57,43,0.12);--red-text:#e57373;
  --blue-bg:rgba(74,144,217,0.1);--blue-text:#6aaae8;
  --purple-text:#a78bfa;
  --radius:8px;--radius-lg:14px;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow:hidden}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;width:100%;transition:border-color .15s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(212,168,67,.1)}
button{font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-radius:var(--radius);padding:10px 18px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);transition:all .15s;font-weight:500}
button:active{opacity:.8;transform:scale(.98)}
button.primary{background:var(--accent);color:#0e0f11;border-color:var(--accent);font-weight:700}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:5px}
.fg{display:flex;flex-direction:column;margin-bottom:12px}
.fr{display:flex;gap:10px}
.fr .fg{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.card-p{padding:1rem}
.sl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .5rem}

/* ── LAYOUT ────────────────────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{display:flex;align-items:center;gap:12px;padding:0 16px;height:52px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#topbar .brand{font-size:18px;font-weight:800;color:var(--accent);font-family:'DM Mono',monospace;letter-spacing:.1em}
#topbar .brand-sub{font-size:11px;color:var(--text3);margin-top:1px}
#topbar .spacer{flex:1}
#topbar .user-chip{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}

#page-wrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(var(--nav-h) + 24px)}
#page-content{padding:14px 14px 0}

/* ── BOTTOM NAV ────────────────────────────────────────────────────────────── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;z-index:100;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 4px;border:none;background:none;color:var(--text3);
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  transition:color .15s;position:relative;
}
.nav-item.active{color:var(--accent)}
.nav-item svg{width:22px;height:22px;stroke-width:1.8}
.nav-badge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center}

/* ── BADGES ────────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}

/* ── CLIENT CARDS ──────────────────────────────────────────────────────────── */
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;overflow:visible;position:relative}
.client-card-body{padding:14px}
.client-name{font-size:16px;font-weight:700;margin-bottom:2px}
.client-slug{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:8px}
.client-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ── 3-DOT MENU ────────────────────────────────────────────────────────────── */
.dot-btn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text2);padding:0;z-index:10}
.dot-menu{position:absolute;top:50px;right:8px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);min-width:190px;z-index:1000;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden}
.dot-menu button{width:100%;text-align:left;padding:12px 16px;border:none;border-radius:0;background:none;font-size:13px;font-weight:500;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dot-menu button:last-child{border-bottom:none}
.dot-menu button:hover,.dot-menu button:active{background:var(--surface3)}
.dot-menu button.danger-item{color:var(--red-text)}

/* ── MODAL / OVERLAY ───────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:600px;padding:1.25rem;max-height:92vh;overflow-y:auto;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 1rem}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:1rem}
.sheet-actions{display:flex;gap:10px;padding-top:4px}
.sheet-actions button{flex:1}

/* ── KPI GRID ──────────────────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;text-align:center}
.kpi-val{font-size:28px;font-weight:800;letter-spacing:-.02em}
.kpi-lbl{font-size:11px;color:var(--text3);margin-top:2px;font-weight:600}

/* ── TOAST ─────────────────────────────────────────────────────────────────── */
#toast-wrap{position:fixed;bottom:calc(var(--nav-h) + 12px);left:12px;right:12px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast-item{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:11px 16px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:toastIn .2s ease;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── FORM STYLES ───────────────────────────────────────────────────────────── */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;margin-bottom:12px}
code{background:var(--surface3);padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px}

/* ── LOGIN ─────────────────────────────────────────────────────────────────── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.login-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:2rem}
.login-logo{font-size:32px;font-weight:800;color:var(--accent);font-family:'DM Mono',monospace;letter-spacing:.12em;margin-bottom:2px}
.login-tagline{font-size:12px;color:var(--text3);margin-bottom:1.75rem}

/* ── PRICING PLAN CARDS ────────────────────────────────────────────────────── */
.plan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.plan-name{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:2px}
.plan-desc{font-size:11px;color:var(--text3);margin-bottom:10px}
.plan-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px}
.plan-row:last-child{border-bottom:none;font-weight:700;color:var(--green-text)}
.plan-row span:last-child{font-family:'DM Mono',monospace;font-weight:600}

/* ── SETTINGS ──────────────────────────────────────────────────────────────── */
.setting-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-info{flex:1}
.setting-title{font-weight:600;font-size:13px;margin-bottom:2px}
.setting-desc{font-size:11px;color:var(--text3);line-height:1.5}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">DRIM</div>
    <div class="login-tagline">Designs · Client Manager</div>
    <div id="login-content">
      <div style="color:var(--text3);font-size:13px;text-align:center;padding:1rem 0">Loading…</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="topbar">
    <div>
      <div class="brand">DRIM</div>
      <div class="brand-sub">Client Manager</div>
    </div>
    <div class="spacer"></div>
    <div class="user-chip">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Drim Designs
    </div>
  </div>
  <div id="page-wrap"><div id="page-content"></div></div>
  <nav id="bottom-nav">
    <button class="nav-item active" id="nav-clients" onclick="showPage('clients')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Clients
      <span class="nav-badge hidden" id="expiry-badge">!</span>
    </button>
    <button class="nav-item" id="nav-add" onclick="showPage('add')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Add
    </button>
    <button class="nav-item" id="nav-pricing" onclick="showPage('pricing')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Pricing
    </button>
    <button class="nav-item" id="nav-settings" onclick="showPage('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </button>
  </nav>
</div>

<div id="toast-wrap"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SB_URL  = 'https://bxtajzmdeigecepwtzss.supabase.co';
const SB_KEY  = (()=>{const k=["eyJhbGciOiJIUzI1NiIsInR5cCI6Ik","pXVCJ9.eyJpc3MiOiJzdXBhYmFzZSI","sInJlZiI6ImJ4dGFqem1kZWlnZWNlc","Hd0enNzIiwicm9sZSI6ImFub24iLCJ","pYXQiOjE3NzU5NDk0NTEsImV4cCI6M","jA5MTUyNTQ1MX0.E44ZP8a0I0cbCTT","WOAFZNsZuJ4XWH1yvrQ5i-KQiNAE"];return k.join('');})();
const PLANS = {
  starter:   {label:'Starter',   monthly:45000, half:240000, yearly:420000,  desc:'1–2 stores, up to 5 users'},
  business:  {label:'Business',  monthly:85000, half:460000, yearly:820000,  desc:'Up to 5 stores, up to 15 users'},
  enterprise:{label:'Enterprise',monthly:150000,half:820000, yearly:1500000, desc:'Unlimited stores & users'},
};
const SETUP_FEE = 50000;

// ─── STATE ────────────────────────────────────────────────────────────────────
let authenticated = false;
let MASTER_PWD    = null;
let _setupMode    = false;
let allClients    = [];
let currentPage   = 'clients';
let _openMenu     = null;

// ─── SUPABASE ─────────────────────────────────────────────────────────────────
async function sb(method, path, body=null){
  try{
    const r = await fetch(SB_URL+'/rest/v1/'+path,{
      method,
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':method==='POST'?'resolution=merge-duplicates,return=representation':''},
      body:body?JSON.stringify(body):undefined
    });
    if(!r.ok){ console.error('SB',r.status,await r.text()); return null; }
    return (method==='GET'||method==='POST')?await r.json():true;
  }catch(e){ console.error('SB error',e); return null; }
}

// ─── CRYPTO ───────────────────────────────────────────────────────────────────
async function hashPwd(p){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg,type='ok'){
  const colors={ok:'var(--green-text)',warn:'var(--amber-text)',err:'var(--red-text)'};
  const el=document.createElement('div');
  el.className='toast-item';
  el.style.color=colors[type]||colors.ok;
  el.textContent=msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function fmk(n){ return 'MK '+Number(n).toLocaleString(); }
function today(){ return new Date().toISOString().slice(0,10); }
function addPeriod(date,cycle){
  const d=new Date(date);
  if(cycle==='monthly') d.setMonth(d.getMonth()+1);
  else if(cycle==='half') d.setMonth(d.getMonth()+6);
  else d.setFullYear(d.getFullYear()+1);
  return d.toISOString();
}
function daysLeft(exp){
  if(!exp) return null;
  return Math.ceil((new Date(exp)-new Date())/(864e5));
}
function statusBadge(t){
  if(t.plan_status==='suspended') return '<span class="badge" style="background:var(--red-bg);color:var(--red-text)">Suspended</span>';
  const d=daysLeft(t.expires_at);
  if(d!==null&&d<=0) return '<span class="badge" style="background:var(--red-bg);color:var(--red-text)">Expired</span>';
  if(d!==null&&d<=7) return '<span class="badge" style="background:var(--amber-bg);color:var(--amber-text)">Expiring · '+d+'d</span>';
  return '<span class="badge" style="background:var(--green-bg);color:var(--green-text)">Active'+(d?'  · '+d+'d':'')+' </span>';
}
function planBadge(plan){
  return '<span class="badge" style="background:var(--surface3);color:var(--text2)">'+(PLANS[plan]?.label||plan||'—')+'</span>';
}
function closeMenus(){ document.querySelectorAll('.dot-menu').forEach(m=>m.remove()); _openMenu=null; }
document.addEventListener('click',e=>{ if(!e.target.closest('.dot-btn')&&!e.target.closest('.dot-menu')) closeMenus(); });

// ─── AUTH ─────────────────────────────────────────────────────────────────────
async function initApp(){
  const rows=await sb('GET','drim_settings?key=eq.admin_password&select=value&limit=1');
  if(rows&&rows.length&&rows[0].value){ MASTER_PWD=rows[0].value; _setupMode=false; }
  else _setupMode=true;
  _setupMode ? showSetup() : showLogin();
}

function showLogin(){
  document.getElementById('login-content').innerHTML=`
    <div class="fg"><label>Password</label><input type="password" id="lp" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="lerr" style="color:var(--red-text);font-size:12px;margin-bottom:10px;display:none">Incorrect password.</div>
    <button class="primary" style="width:100%" onclick="doLogin()">Sign in</button>
    <div style="text-align:center;margin-top:1rem">
      <a href="#" onclick="doLogout()" style="font-size:11px;color:var(--text3)">← Back</a>
    </div>`;
  setTimeout(()=>document.getElementById('lp')?.focus(),100);
}

function showSetup(){
  document.getElementById('login-content').innerHTML=`
    <div style="background:var(--amber-bg);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--amber-text);margin-bottom:1rem;line-height:1.5">
      👋 First time setup. Create your master password.
    </div>
    <div class="fg"><label>New password</label><input type="password" id="sp1" placeholder="At least 6 characters"></div>
    <div class="fg"><label>Confirm password</label><input type="password" id="sp2" placeholder="Repeat" onkeydown="if(event.key==='Enter')doSetup()"></div>
    <div id="serr" style="color:var(--red-text);font-size:12px;margin-bottom:10px;display:none"></div>
    <button class="primary" style="width:100%" onclick="doSetup()">Create password & continue</button>`;
}

async function doSetup(){
  const p1=document.getElementById('sp1').value,p2=document.getElementById('sp2').value;
  const e=document.getElementById('serr'); e.style.display='none';
  if(p1.length<6){e.textContent='At least 6 characters';e.style.display='block';return;}
  if(p1!==p2){e.textContent='Passwords do not match';e.style.display='block';return;}
  const h=await hashPwd(p1);
  const ok=await sb('POST','drim_settings',{key:'admin_password',value:h});
  if(ok){MASTER_PWD=h;authenticated=true;enterApp();toast('✅ Password set!','ok');}
  else{e.textContent='Failed to save. Check connection.';e.style.display='block';}
}

async function doLogin(){
  const p=document.getElementById('lp').value;
  const h=await hashPwd(p);
  if(h===MASTER_PWD){authenticated=true;enterApp();}
  else{document.getElementById('lerr').style.display='block';document.getElementById('lp').value='';}
}

function enterApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  loadClients();
}

function doLogout(){
  authenticated=false;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('login-content').innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:1rem 0">Loading…</div>';
  initApp();
}

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function showPage(p){
  currentPage=p;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+p)?.classList.add('active');
  const pages={clients:renderClients,add:renderAdd,pricing:renderPricing,settings:renderSettings};
  if(pages[p]) pages[p]();
}

// ─── LOAD CLIENTS ─────────────────────────────────────────────────────────────
async function loadClients(){
  const rows=await sb('GET','tenants?select=*&order=created_at.desc');
  allClients=rows||[];
  // Update expiry badge
  const expiring=allClients.filter(t=>{ const d=daysLeft(t.expires_at); return d!==null&&d<=7&&d>0&&t.plan_status!=='suspended'; }).length;
  const badge=document.getElementById('expiry-badge');
  if(badge){ badge.textContent=expiring; badge.classList.toggle('hidden',expiring===0); }
  showPage('clients');
}

// ─── 3-DOT MENU ───────────────────────────────────────────────────────────────
function openDotMenu(slug,btn){
  closeMenus();
  const c=allClients.find(x=>x.slug===slug);
  const menu=document.createElement('div');
  menu.className='dot-menu';
  menu.innerHTML=`
    <button onclick="closeMenus();window.open('/?tenant=${slug}','_blank')"><span>🌐</span> Open link</button>
    <button onclick="closeMenus();copyLink('${slug}')"><span>🔗</span> Copy link</button>
    <button onclick="closeMenus();shareLink('${slug}')"><span>📤</span> Share link</button>
    <button onclick="closeMenus();openQuote('${slug}')"><span>📄</span> Generate quote</button>
    ${slug==='demo'?`<button onclick="closeMenus();openResetDemo()"><span>🔄</span> Reset demo</button>`:`<button onclick="closeMenus();openRenew('${slug}')"><span>🔄</span> Renew</button>`}
    <button onclick="closeMenus();openMigrate('${slug}')"><span>🔁</span> Migrate / repair data</button>
    <button onclick="closeMenus();openEdit('${slug}')"><span>✏️</span> Edit client</button>
    <button onclick="closeMenus();toggleSuspend('${slug}','${c?.plan_status}')" class="${c?.plan_status==='suspended'?'':'danger-item'}">

async function doMigrate(slug, sourceId){
  const statusEl = document.getElementById('mg-status');
  function setStatus(msg, type='info'){
    const colors={info:'var(--blue-text)',ok:'var(--green-text)',err:'var(--red-text)',warn:'var(--amber-text)'};
    statusEl.style.display='block';
    statusEl.style.color=colors[type];
    statusEl.style.background=type==='ok'?'var(--green-bg)':type==='err'?'var(--red-bg)':'var(--surface2)';
    statusEl.style.border='1px solid var(--border2)';
    statusEl.innerHTML=msg;
  }
  setStatus('🔍 Looking for <code>'+sourceId+'</code> row…');

  // Read the source row — no tenant_slug filter so we can find any legacy row
  const rows = await sb('GET', 'tenant_data?id=eq.'+sourceId+'&select=id,tenant_slug,data&limit=5');
  if(!rows){ setStatus('❌ Supabase error reading tenant_data','err'); return; }
  if(!rows.length){ setStatus('❌ No row found with id=<code>'+sourceId+'</code>. Try "List ALL rows" to see what exists.','err'); return; }

  const row = rows[0];
  let parsed;
  try{ parsed = JSON.parse(row.data); }catch(e){ setStatus('❌ Row data is not valid JSON','err'); return; }

  const db = parsed.db || parsed;
  const idCounter = parsed.idCounter || 0;

  setStatus('✅ Found data (tenant_slug on row: <code>'+(row.tenant_slug||'none')+'</code>)<br>Products: <strong>'+(db.products?.length||0)+'</strong> · Users: <strong>'+(db.users?.length||0)+'</strong> · Receipts: <strong>'+(db.receipts?.length||0)+'</strong><br>Writing shards for <code>'+slug+'</code>…','ok');

  // Build the 5 shards exactly as the inventory app does
  const ts = new Date().toISOString();
  const shards = [
    { id:'shard_config',    tenant_slug:slug, updated_at:ts, data:JSON.stringify({ users:db.users||[], products:db.products||[], destinations:db.destinations||[], settings:db.settings||{}, storeList:db.storeList||[], userMemory:db.userMemory||{}, idCounter }) },
    { id:'shard_stock',     tenant_slug:slug, updated_at:ts, data:JSON.stringify({ stock:db.stock||{}, idCounter }) },
    { id:'shard_receipts',  tenant_slug:slug, updated_at:ts, data:JSON.stringify({ receipts:db.receipts||[] }) },
    { id:'shard_issuances', tenant_slug:slug, updated_at:ts, data:JSON.stringify({ issuances:db.issuances||[], transfers:db.transfers||[] }) },
    { id:'shard_log',       tenant_slug:slug, updated_at:ts, data:JSON.stringify({ movements:db.movements||[], activityLog:db.activityLog||[] }) },
  ];

  let allOk = true;
  for(const shard of shards){
    const ok = await sb('POST', 'tenant_data', shard);
    if(!ok){ setStatus('❌ Failed writing shard <code>'+shard.id+'</code>. Check Supabase RLS.','err'); allOk=false; break; }
  }
  if(allOk){
    setStatus('✅ All 5 shards written for <code>'+slug+'</code>!<br><strong>Open the app now:</strong> <a href="'+window.location.origin+'/?tenant='+slug+'" target="_blank" style="color:var(--accent)">/?tenant='+slug+' →</a>','ok');
    toast('✅ Migration complete for '+slug,'ok');
  }
}

async function doInspectShards(slug){
  const statusEl=document.getElementById('mg-status');
  statusEl.style.display='block'; statusEl.style.color='var(--text2)';
  statusEl.style.background='var(--surface2)'; statusEl.style.border='1px solid var(--border2)';
  statusEl.innerHTML='🔍 Loading shards…';
  const rows=await sb('GET','tenant_data?tenant_slug=eq.'+slug+'&select=id,updated_at,data&order=id.asc');
  if(!rows){ statusEl.innerHTML='❌ Supabase error'; return; }
  if(!rows.length){ statusEl.innerHTML='⚠️ <strong>No rows found</strong> for tenant_slug=<code>'+slug+'</code>. This is why the app is blank.'; statusEl.style.color='var(--amber-text)'; return; }
  statusEl.innerHTML='<strong>Rows for <code>'+slug+'</code>:</strong><br>'+rows.map(r=>{
    let parsed={}, size=(r.data||'').length;
    try{ parsed=JSON.parse(r.data); }catch(e){}
    const counts=Object.entries(parsed).map(([k,v])=>Array.isArray(v)?k+':'+v.length:'').filter(Boolean).join(', ');
    return '<code>'+r.id+'</code> — '+size+'B'+(counts?' ('+counts+')':'')+'<br><span style="font-size:10px;color:var(--text3)">'+r.updated_at+'</span>';
  }).join('<br><br>');
}

async function doInspectAll(){
  const statusEl=document.getElementById('mg-status');
  statusEl.style.display='block'; statusEl.style.color='var(--text2)';
  statusEl.style.background='var(--surface2)'; statusEl.style.border='1px solid var(--border2)';
  statusEl.innerHTML='🔍 Loading all rows…';
  const rows=await sb('GET','tenant_data?select=id,tenant_slug,updated_at&order=updated_at.desc&limit=50');
  if(!rows){ statusEl.innerHTML='❌ Supabase error'; return; }
  if(!rows.length){ statusEl.innerHTML='⚠️ tenant_data table is empty!'; statusEl.style.color='var(--amber-text)'; return; }
  const bySlug={};
  rows.forEach(r=>{ const s=r.tenant_slug||'(none)'; if(!bySlug[s])bySlug[s]=[]; bySlug[s].push(r.id); });
  statusEl.innerHTML='<strong>All rows ('+rows.length+' total):</strong><br>'+Object.entries(bySlug).map(([slug,ids])=>'<code>'+slug+'</code> → '+ids.map(i=>'<code>'+i+'</code>').join(', ')).join('<br>');
}

    <h3>📄 Generate Quote</h3>

function updateQuotePreview(){
  const plan=document.getElementById('q_plan')?.value;
  const cycle=document.getElementById('q_cycle')?.value;
  const setup=document.getElementById('q_setup')?.value;
  const p=PLANS[plan]; if(!p) return;
  const sub=p[cycle]; const sAmt=setup==='yes'?SETUP_FEE:0;
  const el=document.getElementById('q_preview'); if(!el) return;
  el.innerHTML=`<strong style="color:var(--accent)">${p.label}</strong><br>${{monthly:'Monthly',half:'6-month',yearly:'Annual'}[cycle]}: <strong>${fmk(sub)}</strong>${sAmt?'<br>Setup: <strong>'+fmk(sAmt)+'</strong>':''}<br><strong style="color:var(--green-text)">Total: ${fmk(sub+sAmt)}</strong>`;
}

async function doChangePwd(){
  const cur=document.getElementById('cp_cur').value,nw=document.getElementById('cp_new').value,con=document.getElementById('cp_con').value;
  const e=document.getElementById('cp-err'); e.style.display='none';
  if(await hashPwd(cur)!==MASTER_PWD){e.textContent='Current password incorrect';e.style.display='block';return;}
  if(nw.length<6){e.textContent='At least 6 characters';e.style.display='block';return;}
  if(nw!==con){e.textContent='Passwords do not match';e.style.display='block';return;}
  const h=await hashPwd(nw);
  const ok=await sb('POST','drim_settings',{key:'admin_password',value:h});
  if(ok){MASTER_PWD=h;toast('✅ Password updated','ok');['cp_cur','cp_new','cp_con'].forEach(id=>document.getElementById(id).value='');}
  else toast('❌ Failed','err');
}

async function doSetSuperPwd(){
  const nw=document.getElementById('sa_new').value,con=document.getElementById('sa_con').value;
  const e=document.getElementById('sa-err'); e.style.display='none';
  if(nw.length<6){e.textContent='At least 6 characters';e.style.display='block';return;}
  if(nw!==con){e.textContent='Passwords do not match';e.style.display='block';return;}
  const h=await hashPwd(nw);
  const ok=await sb('POST','drim_settings',{key:'super_admin_hash',value:h});
  if(ok){toast('✅ Super admin password set','ok');['sa_new','sa_con'].forEach(id=>document.getElementById(id).value='');}
  else toast('❌ Failed','err');
}

async function loadBankToSettings(){
  const rows=await sb('GET','drim_settings?key=like.bank_*&select=key,value')||[];
  const map={}; rows.forEach(r=>map[r.key]=r.value);
  if(document.getElementById('bk_bank')) document.getElementById('bk_bank').value=map.bank_name||'';
  if(document.getElementById('bk_name')) document.getElementById('bk_name').value=map.bank_acname||'';
  if(document.getElementById('bk_acc'))  document.getElementById('bk_acc').value=map.bank_acc||'';
}

async function saveBankDetails(){
  const bank=document.getElementById('bk_bank').value.trim();
  const name=document.getElementById('bk_name').value.trim();
  const acc=document.getElementById('bk_acc').value.trim();
  await Promise.all([
    sb('POST','drim_settings',{key:'bank_name',  value:bank}),
    sb('POST','drim_settings',{key:'bank_acname',value:name}),
    sb('POST','drim_settings',{key:'bank_acc',   value:acc}),
  ]);
  toast('✅ Bank details saved','ok');
}
