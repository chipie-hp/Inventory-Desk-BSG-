<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>BSG — Inventory Desk | Full & Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ----- CSS (same as before, fully included) ----- */
:root{
  --bg:#0e0f11;--surface:#16181c;--surface2:#1e2026;--surface3:#252830;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f0;--text2:#9a9da6;--text3:#5a5d68;
  --accent:#d4a843;--accent2:#e8c06a;
  --green:#3db87a;--green-bg:rgba(61,184,122,0.1);--green-text:#5dd49a;
  --amber:#d4a843;--amber-bg:rgba(212,168,67,0.1);--amber-text:#e8c06a;
  --red:#c0392b;--red-bg:rgba(192,57,43,0.12);--red-text:#e57373;
  --blue:#4a90d9;--blue-bg:rgba(74,144,217,0.1);--blue-text:#6aaae8;
  --radius:8px;--radius-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow-x:hidden}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
select option{background:var(--surface2)}
button{font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;border-radius:var(--radius);padding:8px 18px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);transition:all .15s}
button:hover{background:var(--surface3)}
button:active{transform:scale(.98)}
button.primary{background:var(--accent);color:#0e0f11;border-color:var(--accent);font-weight:600}
button.primary:hover{background:var(--accent2)}
button.success{background:var(--green);color:#0e0f11;border-color:var(--green);font-weight:600}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;font-family:'DM Mono',monospace}
.bg{background:var(--green-bg);color:var(--green-text)}
.bw{background:var(--amber-bg);color:var(--amber-text)}
.bd{background:var(--red-bg);color:var(--red-text)}
.bi{background:var(--blue-bg);color:var(--blue-text)}
.bm{background:var(--surface3);color:var(--text2)}
.bl{background:rgba(61,184,122,0.15);color:var(--green-text);border:1px solid rgba(61,184,122,0.2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1rem}
.card-p{padding:1.25rem}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:.9rem 1.1rem}
.ml{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600}
.mv{font-size:22px;font-weight:600;font-family:'DM Mono',monospace}
.ms{font-size:11px;color:var(--text3);margin-top:3px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
#shell{display:flex;height:100vh;position:relative}
#sidebar{width:225px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s ease;z-index:100}
.sb-brand{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.sb-brand-logo{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.1em;font-family:'DM Mono',monospace}
.sb-brand-sub{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:.04em}
.sb-store{padding:.75rem 1.25rem;border-bottom:1px solid var(--border)}
.sb-store-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:600}
.sb-store select{background:var(--surface2);font-size:12px;padding:6px 10px}
.sb-nav{flex:1;overflow-y:auto;padding:.75rem 0}
.sb-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:.5rem 1.25rem .25rem;font-weight:600}
.sb-item{display:flex;align-items:center;gap:10px;padding:.55rem 1.25rem;font-size:13px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;transition:all .12s}
.sb-item:hover{color:var(--text);background:var(--surface2)}
.sb-item.active{color:var(--accent);background:rgba(212,168,67,.08);border-left-color:var(--accent)}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.sb-user{padding:1rem 1.25rem;border-top:1px solid var(--border)}
.sb-user-name{font-size:13px;font-weight:500}
.sb-user-role{font-size:11px;color:var(--text3);margin-top:1px}
.sb-signout{margin-top:10px;width:100%;font-size:12px;padding:6px 12px}
#main{flex:1;overflow-y:auto;padding:2rem;transition:margin 0.2s ease}
.page-title{font-size:20px;font-weight:600;margin-bottom:.25rem}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:1rem}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{width:100%;max-width:400px;padding:1rem;display:flex;flex-direction:column;align-items:stretch}
.login-logo{font-size:42px;font-weight:700;color:var(--accent);letter-spacing:.12em;font-family:'DM Mono',monospace;text-align:center;margin-bottom:0.25rem}
.login-tagline{text-align:center;font-size:13px;color:var(--text3);margin-bottom:2rem;letter-spacing:.04em}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem}
.login-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.login-field{margin-bottom:1.25rem}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sl{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.5rem 0 .75rem}
.info-box{background:var(--blue-bg);border:1px solid rgba(74,144,217,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--blue-text)}
.warn-box{background:var(--amber-bg);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--amber-text)}
.danger-box{background:var(--red-bg);border:1px solid rgba(224,82,82,.25);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--red-text)}
.ai{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.ai:last-child{border-bottom:none}
.ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:rgba(212,168,67,.15);color:var(--accent)}
.quick-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1rem;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.quick-card:hover{background:var(--surface3);border-color:var(--accent);transform:translateY(-2px)}
.quick-card:active{transform:scale(.97)}
.quick-icon{font-size:24px;margin-bottom:6px}
.quick-label{font-weight:600;font-size:14px;margin-bottom:2px}
.quick-desc{font-size:11px;color:var(--text3)}
.ov-quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.ov-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.5rem}
.kpi-hero{grid-column:span 2;position:relative;overflow:hidden;cursor:pointer}
.kpi-hero::after{content:"📦";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.04;pointer-events:none}
.draft-card{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.draft-card:hover{background:var(--surface3);border-color:var(--accent)}
.draft-card .draft-items{display:none;margin-top:10px;background:var(--surface);border-radius:var(--radius);padding:8px 12px}
#mob-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:8px 12px;font-size:20px;line-height:1;cursor:pointer;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:20px;padding:8px 18px;font-size:13px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#app-footer{position:fixed;bottom:0;left:225px;right:0;height:36px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;letter-spacing:.06em;z-index:50}
.modal-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);max-width:500px;width:90%;padding:1.5rem;box-shadow:0 20px 35px -10px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto}
.modal-card h3{font-size:18px;font-weight:600;margin-bottom:1rem;letter-spacing:-0.02em;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0 6px}
.bulk-item-row{display:flex;gap:8px;margin-bottom:6px}
.bulk-item-row select,.bulk-item-row input{font-size:12px;padding:6px 8px}
.dot-menu-wrap{position:relative;display:inline-block}
.dot-btn{background:none;border:none;color:var(--text3);padding:4px 8px;font-size:20px;cursor:pointer}
.dot-dropdown{position:absolute;right:0;top:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);min-width:140px;z-index:200}
.dot-dropdown button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;border:none;color:var(--text)}
.stock-qty-big{font-size:36px;font-weight:700;font-family:'DM Mono',monospace}
.stock-detail-row{display:flex;gap:12px;margin-top:12px}
.stock-detail-cell{flex:1;text-align:center;background:var(--surface2);border-radius:var(--radius);padding:6px}
.bar-wrap-lg{background:var(--surface3);border-radius:5px;height:8px;position:relative;margin:8px 0}
.bar-fill-lg{height:100%;border-radius:5px}
.reorder-marker{position:absolute;top:0;bottom:0;width:2px;background:rgba(192,57,43,.8)}
.conf-detail.hidden{display:none}
@media(max-width:640px){
  #mob-toggle{display:flex;align-items:center}
  #sidebar{position:fixed;left:0;top:0;height:100vh;width:0;overflow-x:hidden;transition:width 0.2s ease;z-index:150}
  #sidebar.open{width:250px;box-shadow:4px 0 24px rgba(0,0,0,.6)}
  #main{padding:1rem;padding-top:56px;width:100%}
  .ov-quick-grid{gap:8px}
  .quick-card{padding:0.75rem}
  .quick-icon{font-size:20px}
  .quick-label{font-size:12px}
  .ov-kpi-grid{grid-template-columns:1fr 1fr}
  .kpi-hero{grid-column:span 2}
  .mv{font-size:18px!important}
  .fr{grid-template-columns:1fr!important}
  #app-footer{left:0!important}
  .bulk-item-row{flex-wrap:wrap}
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">BSG</div>
    <div class="login-tagline">Inventory Management System</div>
    <div class="login-card">
      <div class="login-field"><label class="login-label">Username</label><input type="text" id="lu" placeholder="Enter your username" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div class="login-field"><label class="login-label">Password</label><input type="password" id="lp" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <div id="lerr" style="color:var(--red-text);font-size:12px;margin-bottom:14px;display:none"></div>
      <button class="primary" style="width:100%;padding:10px" onclick="doLogin()">Sign in</button>
    </div>
  </div>
    <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:1.25rem;font-family:'DM Mono',monospace;letter-spacing:.06em">BSG &middot; Inventory Desk &copy; 2026</div>
  </div>
</div>

<button id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="toast"></div>
<div id="shell" class="hidden">
<div id="global-modal" class="hidden" style="position:fixed;inset:0;z-index:999"></div>
  <div id="sidebar">
    <div class="sb-brand"><div class="sb-brand-logo">BSG</div><div class="sb-brand-sub">Inventory Desk</div></div>
    <div class="sb-store" id="store-switcher"><div class="sb-store-label">Store view</div><select id="store-select" onchange="setStore(this.value)"><option value="all">All stores</option><option value="s1">Alliance1 Stores</option><option value="s2">JTI Stores</option><option value="s3">Area 10 Store</option></select></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-user"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div id="sb-ava" class="ava"></div><div><div id="sb-uname" class="sb-user-name"></div><div id="sb-urole" class="sb-user-role"></div></div></div><button class="sb-signout" onclick="doLogout()">Sign out</button></div>
  </div>
  <div id="main"><div id="pg-overview" class="fade-in"></div><div id="pg-stock" class="hidden fade-in"></div><div id="pg-receive" class="hidden fade-in"></div><div id="pg-issue" class="hidden fade-in"></div><div id="pg-reorder" class="hidden fade-in"></div><div id="pg-products" class="hidden fade-in"></div><div id="pg-history" class="hidden fade-in"></div><div id="pg-reports" class="hidden fade-in"></div><div id="pg-users" class="hidden fade-in"></div><div id="pg-admin" class="hidden fade-in"></div></div>
</div>
<div id="app-footer" style="display:none">BSG · Inventory Desk © 2026</div>

<script>

// ---------- CONSTANTS & GLOBALS ----------
const STORES = { s1:{name:"Alliance1 Stores",short:"A1"}, s2:{name:"JTI Stores",short:"JTI"}, s3:{name:"Area 10 Store",short:"A10"} };
const CATS = ["Grains & Cereals","Dairy & Eggs","Fruits & Veg","Beverages","Cooking Oils","Snacks & Confec.","Cleaning & Hygiene","Other"];
const DEFAULT_DESTINATIONS = [{id:"d1",name:"Kitchen",store:null},{id:"d2",name:"Restaurant",store:null},{id:"d3",name:"Bar",store:"s3"},{id:"d4",name:"Sold (retail)",store:null},{id:"d5",name:"Damaged / waste",store:null},{id:"d6",name:"Staff consumption",store:null},{id:"d7",name:"Other",store:null}];
const DEFAULT_PRODUCTS = [];
const DEFAULT_STOCK = { s1:{}, s2:{}, s3:{} };
const DEFAULT_USERS = [{id:"admin",name:"Administrator",role:"admin",store:null,password:"2026",active:true},{id:"a1_staff",name:"Alliance1 Staff",role:"staff",store:"s1",password:"2026",active:true},{id:"jti_staff",name:"JTI Staff",role:"staff",store:"s2",password:"2026",active:true},{id:"a10_staff",name:"Area 10 Staff",role:"staff",store:"s3",password:"2026",active:true},{id:"manager",name:"Store Manager",role:"manager",store:null,password:"2026",active:true}];
let DB = {users:[],products:[],stock:{s1:{},s2:{},s3:{}},receipts:[],issuances:[],movements:[],destinations:[]};
let CU=null, CS="all", CP="overview", stockSearchTerm="", productSearchTerm="", issLines=[], issDestId=null, idCounter=1000;

// Helpers
function skuKey(sku){return sku.replace(/-/g,"");}
function fmt(n){return "MK "+Math.round(n||0).toLocaleString();}
function todayVal(){return new Date().toISOString().slice(0,10);}
function nowTs(){return new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function pct(q,c){return c>0?Math.min(100,Math.round(q/c*100)):0;}
function barC(p){return p>=60?"#3db87a":p>=30?"#d4a843":"#e05252";}
function nextId(){return ++idCounter;}
function getKeys(){return CS==="all"?Object.keys(STORES):[CS];}
function getProd(sku){return DB.products.find(p=>p.sku===sku)||{};}
function getSR(store,sku){return DB.stock[store]?.[skuKey(sku)]||{qty:0,reorder:10,max:100};}
function currentUser(){return DB.users.find(u=>u.id===CU)||{};}
function isAdmin(){return currentUser().role==="admin";}
function isManager(){return ["admin","manager"].includes(currentUser().role);}
function getDestsForStore(storeId){return DB.destinations.filter(d=>d.store===null||d.store===storeId);}
function stStatus(sr){if(!sr||sr.qty===0)return"out"; if(sr.qty<=sr.reorder)return"critical"; if(sr.qty/sr.max<0.3)return"low"; return"s";}
function itBadge(name){ const colors={Kitchen:"bi",Restaurant:"bi",Bar:"bi","Sold (retail)":"bg","Damaged / waste":"bd","Staff consumption":"bm",Other:"bm"}; return `<span class="badge ${colors[name]||"bm"}">${name}</span>`; }

// ═══════════════════════════════════════════════════════════════
// SUPABASE CONFIGURATION
// Replace with your actual Supabase project credentials
// Then run the SQL below once in your Supabase SQL editor.
/*
  CREATE TABLE IF NOT EXISTS bsg_inventory (
    id TEXT PRIMARY KEY,
    data TEXT NOT NULL,
    updated_at TIMESTAMPTZ DEFAULT NOW()
  );
  ALTER TABLE bsg_inventory ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "Allow all" ON bsg_inventory FOR ALL USING (true) WITH CHECK (true);
*/
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://bxtajzmdeigecepwtzsz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4dGFqem1kZWlnZWNlcHd0enNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDk0NTEsImV4cCI6MjA5MTUyNTQ1MX0.E44ZP8a0I0cbCTTWOAFZNsZuJ4XWH1yvrQ5i-KQiNAE';
const SUPABASE_TABLE = 'bsg_inventory';

async function _sbReq(method, path, body=null){
  try{
    const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {
      method,
      headers:{
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': method==='POST'?'resolution=merge-duplicates,return=minimal':'',
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok){ console.warn('Supabase '+method+' failed:', res.status, await res.text()); return null; }
    return method==='GET' ? await res.json() : true;
  } catch(e){ console.warn('Supabase offline:', e.message); return null; }
}

async function saveDB(){
  // Save to Supabase (upsert by id)
  await _sbReq('POST', SUPABASE_TABLE,
    { id:'bsg_main', data: JSON.stringify({db:DB, idCounter}), updated_at: new Date().toISOString() }
  );
  // Always keep a local fallback
  try{ await window.storage.set('bsg_ims_v4', JSON.stringify({db:DB,idCounter})); }catch(e){}
}

async function loadDB(){
  let loaded = false;
  // 1. Try Supabase
  try{
    const rows = await _sbReq('GET', SUPABASE_TABLE+'?id=eq.bsg_main&select=data&limit=1');
    if(rows && rows.length && rows[0].data){
      const p = JSON.parse(rows[0].data);
      DB = p.db || p;
      if(p.idCounter) idCounter = p.idCounter;
      if(DB.storeList) DB.storeList.forEach(s=>{ STORES[s.key]=s.val; if(!DB.stock[s.key]) DB.stock[s.key]={}; });
      loaded = true;
    }
  }catch(e){ console.warn('Supabase load error:', e); }
  // 2. Local storage fallback
  if(!loaded){
    try{
      const r = await window.storage.get('bsg_ims_v4');
      if(r && r.value){
        const p = JSON.parse(r.value);
        DB = p.db || p;
        if(p.idCounter) idCounter = p.idCounter;
        if(DB.storeList) DB.storeList.forEach(s=>{ STORES[s.key]=s.val; if(!DB.stock[s.key]) DB.stock[s.key]={}; });
        loaded = true;
      }
    }catch(e){}
  }
  // 3. First run — seed defaults
  if(!DB.users || !DB.users.length) DB.users = JSON.parse(JSON.stringify(DEFAULT_USERS));
  if(!DB.products || !DB.products.length) DB.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
  if(!DB.stock || !Object.keys(DB.stock.s1||{}).length) DB.stock = JSON.parse(JSON.stringify(DEFAULT_STOCK));
  if(!DB.destinations || !DB.destinations.length) DB.destinations = JSON.parse(JSON.stringify(DEFAULT_DESTINATIONS));

function renderStock(){ 
  let stock=getVisibleStock(); if(stockSearchTerm){const t=stockSearchTerm.toLowerCase();stock=stock.filter(i=>i.name.toLowerCase().includes(t)||(i.cat||"").toLowerCase().includes(t));} 
  const showS=CS==="all"; const rows=stock.map(i=>{ const p=pct(i.qty||0,i.max||1); const st=stStatus(i); const rp=pct(i.reorder,i.max||1); const sc=st==="s"?"var(--green-text)":st==="low"?"var(--amber-text)":"var(--red-text)"; const sbadge=st==="s"?'<span class="badge bg">Good</span>':st==="low"?'<span class="badge bw">Low</span>':st==="critical"?'<span class="badge bd">Critical</span>':'<span class="badge bd">Out</span>'; const pd=JSON.stringify({name:i.name,sku:i.sku,store:i.store,qty:i.qty||0,cost:i.cost,value:(i.qty||0)*(i.cost||0),unit:i.unit,reorder:i.reorder,max:i.max,cat:i.cat}).replace(/'/g,"&#39;"); return `<tr onclick="showStockValueModal(JSON.parse(this.querySelector('.__pd').dataset.pd))" style="cursor:pointer"><td><span class="__pd" data-pd='${pd}' style="display:none"></span><div style="font-weight:500">${i.name}</div><div style="font-size:10px;color:var(--text3);margin-top:1px">${showS?(STORES[i.store]?.short||i.store)+" · ":""}${i.cat}</div></td><td style="min-width:140px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px"><span style="font-size:15px;font-weight:700;font-family:'DM Mono';color:${sc}">${i.qty||0} <span style="font-size:10px;font-weight:400;color:var(--text3)">${i.unit}s</span></span><span style="font-size:10px;color:var(--text3)">${p}%</span></div><div style="height:8px;background:var(--surface3);border-radius:4px;overflow:hidden;position:relative"><div style="height:100%;width:${p}%;background:${barC(p)};border-radius:4px;transition:width .4s"></div><div style="position:absolute;top:0;bottom:0;left:${rp}%;width:2px;background:rgba(192,57,43,.7)"></div></div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:2px"><span>0</span><span style="color:var(--red-text)">↑${i.reorder}</span><span>${i.max}</span></div></td><td style="text-align:right;font-family:'DM Mono';font-size:12px;color:var(--text3)">${fmt((i.qty||0)*(i.cost||0))}</td><td style="text-align:right">${sbadge}</td></tr>`; }).join(""); 
  document.getElementById("pg-stock").innerHTML=`<div class="page-title">Stock levels</div><div class="page-sub">${CS==="all"?"All stores":STORES[CS]?.name}</div><div style="display:flex;gap:8px;margin-bottom:1rem;align-items:center"><div style="position:relative;flex:1"><span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none">🔍</span><input type="text" id="stockSearchInput" style="padding-left:32px" placeholder="Search products…" value="${stockSearchTerm.replace(/"/g,"&quot;")}" oninput="liveStockSearch(this.value)"></div><button onclick="exportStockCSV()" style="padding:8px 12px;font-size:12px;white-space:nowrap;flex-shrink:0">📥 CSV</button></div>${renderMetrics()}<div class="card"><table><thead><tr><th>Product</th><th style="min-width:140px">Level</th><th style="text-align:right">Value</th><th style="text-align:right">Status</th></tr></thead><tbody>${rows||`<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--text3)">No products found</td></tr>`}</tbody></table></div><div id="valueModal"></div>`;

function liveStockSearch(v){ stockSearchTerm=v; clearTimeout(window._stockSearchTimer); window._stockSearchTimer=setTimeout(()=>{ renderStock(); },100); }
function showStockValueModal(p){

}
function closeStockModal(){ document.getElementById("valueModal").innerHTML=""; }
function renderMetrics(){ const stock=getVisibleStock(); const val=stock.reduce((a,i)=>a+(i.qty||0)*(i.cost||0),0); const crit=stock.filter(i=>["critical","out"].includes(stStatus(i))).length; const low=stock.filter(i=>stStatus(i)==="low").length; return `<div class="metrics"><div class="metric"><div class="ml">Stock value</div><div class="mv">${fmt(val)}</div><div class="ms">${stock.reduce((a,i)=>a+(i.qty||0),0)} units</div></div><div class="metric"><div class="ml">Total received</div><div class="mv">${fmt(DB.receipts.filter(r=>getKeys().includes(r.store)&&r.confirmed).reduce((a,r)=>a+r.total,0))}</div><div class="ms">confirmed</div></div><div class="metric"><div class="ml">Total issued</div><div class="mv">${fmt(DB.issuances.filter(r=>getKeys().includes(r.store)&&r.confirmed).reduce((a,r)=>a+r.total,0))}</div><div class="ms">confirmed</div></div><div class="metric"><div class="ml">Critical/out</div><div class="mv" style="color:var(--red-text)">${crit}</div><div class="ms">need reorder</div></div><div class="metric"><div class="ml">Low stock</div><div class="mv" style="color:var(--amber-text)">${low}</div><div class="ms">below 30%</div></div></div>`; }
function exportStockCSV(){ 
  const stock=getVisibleStock(); const rows=[["Product","SKU","Category","Store","Qty","Unit","Reorder","Max","Status","Unit Cost","Value"]]; 
  stock.forEach(i=>{ const st=stStatus(i); rows.push([i.name,i.sku,i.cat,STORES[i.store]?.name||i.store,i.qty||0,i.unit,i.reorder,i.max,st==="s"?"In Stock":st==="critical"?"Critical":st==="low"?"Low":"Out",i.cost||0,(i.qty||0)*(i.cost||0)]); }); 
  downloadCSV(rows,"stock_levels_"+todayVal());
}
function downloadCSV(rows,filename){ const csv=rows.map(r=>r.map(c=>{const s=String(c);return(s.includes(",")||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s;}).join(",")).join("\n"); const blob=new Blob([csv],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename+".csv";a.click(); }

function renderReceive(){ 
  const ud=currentUser(); const useStore=ud.role==="staff"?ud.store:CS; const storeName=useStore==="all"?"All stores":(STORES[useStore]?.name||useStore); const showActions=useStore!=="all";

  document.getElementById("pg-receive").innerHTML=`

function toggleDraftItems(card,ev){ if(ev.target.closest('button'))return; const d=card.querySelector('.draft-items'); if(d)d.style.display=d.style.display==='block'?'none':'block'; }
function openReceiveModal(store, mode){

function autoFillCost(){ const sku=document.getElementById('rec_product')?.value; if(sku){ const p=getProd(sku); if(p.cost) document.getElementById('rec_cost').value=p.cost; } }
function addBulkRow(store){ const id='br_'+Date.now()+Math.random(); const prodOpts=DB.products.map(p=>`<option value="${p.sku}">${p.name}</option>`).join(""); const div=document.createElement('div'); div.className='bulk-item-row'; div.id=id; div.innerHTML=`<select style="flex:2" onchange="(function(s,i){var p=DB.products.find(x=>x.sku===s.value);if(p&&p.cost)document.getElementById(i+'_cost').value=p.cost;updateBulkTotal()})(this,'${id}')">${prodOpts}</select><input type="number" placeholder="Qty" id="${id}_qty" oninput="updateBulkTotal()" style="flex:1"><input type="number" placeholder="Cost" id="${id}_cost" oninput="updateBulkTotal()" style="flex:1"><button onclick="document.getElementById('${id}').remove();updateBulkTotal()" style="color:var(--red-text)">✕</button>`; document.getElementById('bulk_rows').appendChild(div); updateBulkTotal(); }
function updateBulkTotal(){ let total=0; document.querySelectorAll('.bulk-item-row').forEach(r=>{ const inputs=r.querySelectorAll('input'); const qty=parseFloat(inputs[0]?.value)||0; const cost=parseFloat(inputs[1]?.value)||0; total+=qty*cost; }); const t=document.getElementById('bulk_total'); if(t) t.textContent=total>0?`Total: ${fmt(total)}`:''; }
async function saveSimpleReceipt(store){
  const supplier=document.getElementById('rec_supplier').value.trim(); const date=document.getElementById('rec_date').value; const sku=document.getElementById('rec_product').value; const qty=parseInt(document.getElementById('rec_qty').value); const cost=parseInt(document.getElementById('rec_cost').value); const invoice=document.getElementById('rec_invoice').value;
  if(!supplier||!sku||qty<=0||cost<=0){ document.getElementById('recErr').textContent='All fields required.'; document.getElementById('recErr').style.display='block'; return; }
  const p=getProd(sku); DB.receipts.push({id:nextId(),store,supplier,date,ref:invoice,items:[{sku,name:p.name||sku,qty,cost,lineVal:qty*cost}],total:qty*cost,confirmed:false,createdBy:CU,createdAt:nowTs()}); await saveDB(); closeModal(); renderReceive(); showToast('Draft saved','ok');
}
async function saveBulkReceipt(store){
  const supplier=document.getElementById('bulk_supplier').value.trim(); const date=document.getElementById('bulk_date').value; const invoice=document.getElementById('bulk_invoice').value;
  if(!supplier){ document.getElementById('bulkErr').textContent='Supplier required.'; document.getElementById('bulkErr').style.display='block'; return; }
  const rows=document.querySelectorAll('.bulk-item-row'); const items=[]; for(let r of rows){ const sku=r.querySelector('select').value; const inputs=r.querySelectorAll('input'); const qty=parseInt(inputs[0].value); const cost=parseInt(inputs[1].value); if(sku&&qty>0&&cost>0){ const p=getProd(sku); items.push({sku,name:p.name||sku,qty,cost,lineVal:qty*cost}); } }
  if(!items.length){ document.getElementById('bulkErr').textContent='Add at least one valid item.'; document.getElementById('bulkErr').style.display='block'; return; }
  const total=items.reduce((a,i)=>a+i.lineVal,0); DB.receipts.push({id:nextId(),store,supplier,date,ref:invoice,items,total,confirmed:false,createdBy:CU,createdAt:nowTs()}); await saveDB(); closeModal(); renderReceive(); showToast('Bulk draft saved','ok');
}
async function confirmReceipt(id){ 
  const r=DB.receipts.find(x=>x.id===id); if(!r||r.confirmed)return; 
  showConfirm(`Confirm GRN-${r.id}?`, async ()=>{ for(let l of r.items){ const key=skuKey(l.sku); if(!DB.stock[r.store][key]) DB.stock[r.store][key]={qty:0,reorder:10,max:100}; const sr=DB.stock[r.store][key]; sr.qty=Math.min(sr.max,sr.qty+l.qty); DB.movements.push({id:nextId(),store:r.store,sku:l.sku,type:'receive',change:l.qty,after:sr.qty,ref:`GRN-${r.id}`,by:CU,ts:nowTs()}); } r.confirmed=true; r.confirmedBy=CU; r.confirmedAt=nowTs(); await saveDB(); renderReceive(); showToast('Receipt confirmed','ok'); },'confirm','success');
}
async function delReceipt(id){ const idx=DB.receipts.findIndex(r=>r.id===id); if(idx>-1&&!DB.receipts[idx].confirmed){ DB.receipts.splice(idx,1); await saveDB(); renderReceive(); showToast('Draft deleted','warn'); } }

  const cH=confirmedAll.length===0?`<div style="padding:16px;color:var(--text3)">No confirmed issuances</div>`:confirmedAll.map(r=>{ const itemsHtml=r.items.map(l=>{const p=getProd(l.sku);return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px"><span>${l.name}</span><span style="font-family:'DM Mono'">${l.qty} ${p.unit||'unit'} · ${fmt(l.cost)} ea.</span></div>`;}).join(""); return `<div class="draft-card" onclick="toggleDraftItems(this,event)"><div style="display:flex;gap:10px"><div style="flex:1"><div style="font-weight:600">ISS-${r.id} ${itBadge(r.destination)}${r.issuedTo?" → "+r.issuedTo:""}</div><div style="font-size:11px;color:var(--text3)">${STORES[r.store]?.name||r.store} · ${r.date} · ${r.items.length} items</div><div style="font-size:10px;color:var(--amber-text)">✓ Confirmed by ${r.confirmedBy||''} ${r.confirmedAt||''}</div></div><span style="font-family:'DM Mono';font-weight:600;color:var(--amber-text)">${fmt(r.total)}</span></div><div class="draft-items">${itemsHtml}<div style="display:flex;justify-content:space-between;padding-top:7px;font-weight:700"><span>Total</span><span>${fmt(r.total)}</span></div></div></div>`;}).join("");
  document.getElementById("pg-issue").innerHTML=`

    ${showActions?`<div style="margin-bottom:1.25rem"><button class="primary" onclick="openIssueModal('${useStore}')">＋ Issue stock</button></div>`:`<div class="warn-box">Select a store to issue stock.</div>`}
    ${showActions?`<div class="sl">Pending drafts (${drafts.length})</div><div class="card">${dH}</div>`:''}

function applyIssueDateFilter(){ window.issueFrom=document.getElementById('issFrom').value; window.issueTo=document.getElementById('issTo').value; renderIssue(); }
function openIssueModal(store){ 
  const dests=getDestsForStore(store); if(!issDestId||!dests.find(d=>d.id===issDestId)) issDestId=dests[0]?.id; 
  const destOpts=dests.map(d=>`<option value="${d.id}"${d.id===issDestId?" selected":""}>${d.name}</option>`).join("");

    <div class="fr"><div class="fg"><label>Date</label><input type="date" id="idate" value="${todayVal()}"></div><div class="fg"><label>Notes</label><input id="inotes"></div></div>
    <div style="border-top:1px solid var(--border);padding-top:1rem"><div class="fr" style="align-items:flex-end"><div class="fg" style="flex:2"><label>Product</label><div style="position:relative"><input type="text" id="isku_search" placeholder="Search…" oninput="showIssDrop(this.value,'${store}')" onclick="showIssDrop(this.value,'${store}')"><div id="isku_dd" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface2);border:1px solid var(--border2);z-index:600;max-height:200px;overflow-y:auto"></div></div><input type="hidden" id="isku"></div><div class="fg" style="flex:0 0 90px"><label>Qty</label><input type="number" id="iqty" min="1" value="1"></div><div style="padding-bottom:14px"><button onclick="addIssLine('${store}')">＋ Add</button></div></div>

function showIssDrop(q,store){ const dd=document.getElementById('isku_dd'); if(!dd)return; const avail=DB.products.filter(p=>(getSR(store,p.sku).qty||0)>0); const filtered=q?avail.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())):avail; if(!filtered.length){ dd.innerHTML='<div style="padding:10px;color:var(--text3)">No stock</div>'; dd.style.display='block'; return; } dd.innerHTML=filtered.slice(0,10).map(p=>{ const sr=getSR(store,p.sku); return `<div onclick="pickIssProd('${p.sku}','${p.name}')" style="padding:10px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)"><div><div style="font-weight:500">${p.name}</div><div style="font-size:10px">${p.cat}</div></div><span style="font-family:'DM Mono'">${sr.qty} avail</span></div>`; }).join(""); dd.style.display='block'; setTimeout(()=>{ document.addEventListener('click', function closeDrop(e){ if(!dd.contains(e.target) && e.target.id!=='isku_search'){ dd.style.display='none'; document.removeEventListener('click',closeDrop); } }); },50); }
function pickIssProd(sku,name){ document.getElementById('isku_search').value=name; document.getElementById('isku').value=sku; document.getElementById('isku_dd').style.display='none'; }
function addIssLine(store){ const sku=document.getElementById('isku').value; const qty=parseInt(document.getElementById('iqty').value); if(!sku||qty<=0){ alert('Select product and quantity'); return; } const sr=getSR(store,sku); if(qty>sr.qty){ alert(`Only ${sr.qty} available`); return; } const p=getProd(sku); issLines.push({sku,name:p.name,qty,cost:p.cost,lineVal:qty*p.cost,unit:p.unit}); document.getElementById('iqty').value=''; renderIssLines(); }
function renderIssLines(){ const el=document.getElementById('iss-lines'); if(!el)return; if(!issLines.length){ el.innerHTML=''; return; } const total=issLines.reduce((a,l)=>a+l.lineVal,0); el.innerHTML=`<div class="card"><table><thead><tr><th>Product</th><th>Qty</th><th>Unit cost</th><th>Value</th><th></th></tr></thead><tbody>${issLines.map((l,i)=>`<tr><td>${l.name}</td><td>${l.qty} ${l.unit}</td><td>${fmt(l.cost)}</td><td>${fmt(l.lineVal)}</td><td><button style="color:var(--red-text);padding:2px 8px" onclick="issLines.splice(${i},1);renderIssLines()">✕</button></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="3">Total</td><td>${fmt(total)}</td><td></td></tr></tfoot></table></div>`; }
async function saveIssueFromModal(store){ if(!issLines.length){ document.getElementById('iss-modal-err').textContent='Add at least one item.'; document.getElementById('iss-modal-err').style.display='block'; return; } const destId=issDestId; const dest=DB.destinations.find(d=>d.id===destId); const destName=dest?dest.name:'Other'; DB.issuances.push({id:nextId(),store,destination:destName,issuedTo:document.getElementById('iit')?.value||'',date:document.getElementById('idate')?.value||todayVal(),notes:document.getElementById('inotes')?.value||'',items:issLines.map(l=>({sku:l.sku,name:l.name,qty:l.qty,cost:l.cost,lineVal:l.lineVal})),total:issLines.reduce((a,l)=>a+l.lineVal,0),confirmed:false,createdBy:CU,createdAt:nowTs()}); issLines=[]; await saveDB(); closeModal(); renderIssue(); showToast('Draft saved','ok'); }
async function confirmIssue(id){ const r=DB.issuances.find(x=>x.id===id); if(!r||r.confirmed)return; for(let l of r.items){ const avail=getSR(r.store,l.sku).qty||0; if(avail<l.qty){ showToast(`Insufficient stock for ${l.name}`,'warn'); return; } } showConfirm(`Confirm ISS-${r.id}?`, async ()=>{ for(let l of r.items){ const key=skuKey(l.sku); const sr=DB.stock[r.store][key]; sr.qty=Math.max(0,sr.qty-l.qty); DB.movements.push({id:nextId(),store:r.store,sku:l.sku,type:'issue',change:-l.qty,after:sr.qty,ref:`ISS-${r.id}`,destination:r.destination,by:CU,ts:nowTs()}); } r.confirmed=true; r.confirmedBy=CU; r.confirmedAt=nowTs(); await saveDB(); renderIssue(); showToast('Issue confirmed','ok'); },'confirm','success'); }
async function delIssue(id){ const idx=DB.issuances.findIndex(r=>r.id===id); if(idx>-1&&!DB.issuances[idx].confirmed){ DB.issuances.splice(idx,1); await saveDB(); renderIssue(); showToast('Draft deleted','warn'); } }

function renderReorder(){ const stock=getVisibleStock(); const urgent=stock.filter(i=>(i.qty||0)<=i.reorder); const approaching=stock.filter(i=>(i.qty||0)>i.reorder&&(i.qty||0)/i.max<0.4); document.getElementById("pg-reorder").innerHTML=`<div class="page-title">Reorder engine</div><div class="page-sub">Auto-suggestions</div><div class="sl">Urgent (${urgent.length})</div><div class="card"><table><thead><tr><th>Product</th><th>On hand</th><th>Reorder</th><th>Suggest</th><th>Est. cost</th><th>Priority</th></tr></thead><tbody>${urgent.map(i=>{ const suggest=Math.max(0,(i.max-i.qty)+Math.round(i.reorder*0.5)); return `<tr><td>${i.name}<div style="font-size:10px">${i.sku} ${CS==="all"?STORES[i.store]?.short:""}</div></td><td>${i.qty}</td><td>${i.reorder}</td><td>${suggest} ${i.unit}</td><td>${fmt(suggest*i.cost)}</td><td><span class="badge bd">Urgent</span></td></tr>`; }).join("")||'<tr><td colspan="6">No urgent items</td></tr>'}</tbody></table></div>`; }
function renderProducts(){
  let prods=DB.products;
  if(productSearchTerm){const t=productSearchTerm.toLowerCase();prods=prods.filter(p=>p.name.toLowerCase().includes(t)||p.cat.toLowerCase().includes(t));}
  const rows=prods.map(p=>{
    const storeKeys=Object.keys(STORES);
    const totalQty=storeKeys.reduce((a,k)=>a+(getSR(k,p.sku).qty||0),0);
    const worstSt=storeKeys.map(k=>stStatus(getSR(k,p.sku))).reduce((w,s)=>{
      const rank={out:3,critical:2,low:1,s:0};
      return rank[s]>rank[w]?s:w;
    },"s");
    const sbadge=worstSt==="s"?'<span class="badge bg">Good</span>':worstSt==="low"?'<span class="badge bw">Low</span>':worstSt==="critical"?'<span class="badge bd">Critical</span>':'<span class="badge bd">Out</span>';
    const mid="dm_"+p.sku.replace(/[^a-z0-9]/gi,"_");

function renderHistory(){
  const keys = getKeys();
  const moves = DB.movements.filter(m=>keys.includes(m.store)).slice().reverse();
  // Confirmed transactions (receipts + issuances)
  const txns = [
    ...DB.receipts.filter(r=>keys.includes(r.store)&&r.confirmed).map(r=>({...r,_type:'receipt'})),
    ...DB.issuances.filter(r=>keys.includes(r.store)&&r.confirmed).map(r=>({...r,_type:'issuance'}))
  ].sort((a,b)=>(b.confirmedAt||'').localeCompare(a.confirmedAt||''));

  const txnRows = txns.length===0
    ? `<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">No transactions yet</div>`
    : txns.map(r=>{
        const isRec = r._type==='receipt';
        const ref = isRec ? `GRN-${r.id}` : `ISS-${r.id}`;
        const label = isRec ? r.supplier : (r.destination+(r.issuedTo?' → '+r.issuedTo:''));
        const color = isRec ? 'var(--green-text)' : 'var(--amber-text)';
        const itemLines = r.items.map(l=>{
          const prod = getProd(l.sku);
          const unit = prod.unit||'unit';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px">
            <span style="font-weight:500">${l.name}</span>
            <span style="font-family:'DM Mono';color:var(--text3)">${l.qty} ${unit} · ${fmt(l.cost)} ea. · <span style="color:${color}">${fmt(l.qty*l.cost)}</span></span>
          </div>`;
        }).join('');
        const uid = 'hist_'+r._type+'_'+r.id;
        return `<div onclick="document.getElementById('${uid}').classList.toggle('hidden')" style="padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                <span class="badge ${isRec?'bg':'bw'}" style="font-size:10px;margin-right:6px">${isRec?'IN':'OUT'}</span>
                ${ref} — ${label}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">${STORES[r.store]?.name||r.store} · ${r.date} · ${r.items.length} item${r.items.length!==1?'s':''} · <span style="opacity:.6">tap to expand</span></div>
            </div>
            <div style="font-family:'DM Mono';font-size:13px;font-weight:600;color:${color};flex-shrink:0">${fmt(r.total)}</div>
          </div>
          <div id="${uid}" class="hidden" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            ${itemLines}
            <div style="display:flex;justify-content:space-between;padding-top:6px;font-size:12px;font-weight:700">
              <span>Total</span><span style="font-family:'DM Mono';color:${color}">${fmt(r.total)}</span>
            </div>
          </div>
        </div>`;
      }).join('');

  document.getElementById('pg-history').innerHTML=`
    <div class="page-title">History</div>
    <div class="page-sub">${CS==='all'?'All stores':STORES[CS]?.name} — full transaction log</div>
    <div class="sl">All transactions (${txns.length})</div>
    <div class="card">${txnRows}</div>`;
}

function renderReports(rType, rFrom, rTo){

  document.getElementById('pg-reports').innerHTML=`

    <div style="display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap">
      ${typeTab('received','📦 Received')}${typeTab('issued','📤 Issued')}${typeTab('stock','📊 Stock levels')}
    </div>
    ${dateBar}

    ${tableHTML}`;
}

function showModal(html){ const m=document.getElementById("global-modal"); m.innerHTML=`<div class="modal-mask" onclick="closeModal()"><div class="modal-card" onclick="event.stopPropagation()">${html}</div></div>`; m.classList.remove("hidden"); }
function closeModal(){ document.getElementById("global-modal").classList.add("hidden"); document.getElementById("global-modal").innerHTML=""; }
function showConfirm(msg, onYes, yesLabel='Confirm', yesClass='primary', detail=''){
  window._confirmCb = onYes;
  const isDanger = yesClass === 'danger';
  const isSuccess = yesClass === 'success';
  const color = isDanger ? 'var(--red-text)' : isSuccess ? 'var(--green-text)' : 'var(--blue-text)';
  const bg = isDanger ? 'rgba(192,57,43,0.15)' : isSuccess ? 'rgba(61,184,122,0.15)' : 'rgba(74,144,217,0.15)';
  const icon = isDanger
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
    : isSuccess
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" width="36" height="36"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
  const heading = isDanger ? 'Are you sure?' : isSuccess ? 'Confirm' : 'Notice';
  const btnLabel = isDanger ? 'Yes, delete' : (yesLabel === 'ok' ? 'Got it' : yesLabel);
  const isInfoOnly = yesLabel === 'ok';
  showModal(`
    <div style="text-align:center;padding:1.25rem 0 .75rem">
      <div style="width:64px;height:64px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;border:1px solid ${color}33">${icon}</div>
      <div style="font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:.4rem;color:var(--text)">${heading}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:${detail ? '.5rem' : '1.5rem'}">${msg}</div>
      ${detail ? `<div style="font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:1.5rem;line-height:1.5;text-align:left">${detail}</div>` : ''}
    </div>
    <div style="display:flex;gap:10px">
      ${isInfoOnly ? '' : `<button style="flex:1;padding:10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;font-size:13px" onclick="closeModal()">Cancel</button>`}
      <button class="${isInfoOnly ? 'primary' : yesClass}" style="flex:1;padding:10px;border-radius:var(--radius);font-weight:600;font-size:13px;cursor:pointer" onclick="closeModal();if(window._confirmCb){const cb=window._confirmCb;window._confirmCb=null;cb();}">${btnLabel}</button>
    </div>`);
}

function showToast(msg,type){ const t=document.getElementById("toast"); t.textContent=msg; t.style.color=type==="ok"?"var(--green-text)":type==="warn"?"var(--amber-text)":"var(--text)"; t.style.opacity="1"; setTimeout(()=>t.style.opacity="0",2400); }
function getMonthStart(){ const d=new Date(); d.setDate(1); return d.toISOString().slice(0,10); }

async function addStore(){ const name=document.getElementById("st_name")?.value.trim(); const short=document.getElementById("st_short")?.value.trim().toUpperCase().slice(0,4); if(!name||!short){showToast("Store name and short code are required","warn");return;} const key="sx"+Date.now(); STORES[key]={name,short}; if(!DB.stock[key])DB.stock[key]={}; DB.products.forEach(p=>{const k=skuKey(p.sku);if(!DB.stock[key][k])DB.stock[key][k]={qty:0,reorder:10,max:100};}); await saveDB(); refreshStoreSwitcher(); renderAdmin(); showToast(name+" added","ok"); }

async function _doRemoveStore(key){ delete STORES[key]; delete DB.stock[key]; DB.receipts=DB.receipts.filter(r=>r.store!==key); DB.issuances=DB.issuances.filter(r=>r.store!==key); DB.movements=DB.movements.filter(m=>m.store!==key); if(CS===key){CS="all";const sel=document.getElementById("store-select");if(sel)sel.value="all";} await saveDB(); refreshStoreSwitcher(); renderAdmin(); showToast("Store removed","ok"); }
async function addDestination(){ const name=document.getElementById("dname").value.trim(); const store=document.getElementById("dstore").value||null; if(!name){alert("Enter name");return;} if(DB.destinations.find(d=>d.name.toLowerCase()===name.toLowerCase()&&d.store===store)){alert("Exists");return;} DB.destinations.push({id:"d"+(Date.now()),name,store:store||null}); await saveDB(); renderAdmin(); showToast("Destination added","ok"); }
async function _doDeleteDest(id){ DB.destinations=DB.destinations.filter(d=>d.id!==id); await saveDB(); renderAdmin(); showToast("Destination removed","ok"); }

async function changeAdminPwd(){ const cp=document.getElementById("acp").value; const np=document.getElementById("anp").value; const np2=document.getElementById("anp2").value; const admin=DB.users.find(u=>u.id==="admin"); if(admin.password!==cp){alert("Current password incorrect");return;} if(!np||np!==np2){alert("New password mismatch/empty");return;} admin.password=np; await saveDB(); alert("Password changed"); renderAdmin(); }
async function resetCurrentStore(){ if(CS==="all"){ showConfirm("No specific store selected. Select a store first, or use Reset Entire App.",()=>{},"ok","primary"); return; } showConfirm(`Reset store ${STORES[CS]?.name}?`,()=>_doResetStore(CS),"reset store","danger","All stock, receipts and movements for this store will be deleted."); }
function resetEntireApp(){ showConfirm("Reset the entire app?",()=>_doResetAll(),"reset everything","danger","ALL data — every store, product, transaction and history — will be permanently deleted."); }
async function _doResetStore(key){ DB.stock[key]={}; DB.products.forEach(p=>{DB.stock[key][skuKey(p.sku)]={qty:0,reorder:10,max:100};}); DB.receipts=DB.receipts.filter(r=>r.store!==key); DB.issuances=DB.issuances.filter(r=>r.store!==key); DB.movements=DB.movements.filter(m=>m.store!==key); await saveDB(); showToast(STORES[key]?.name+" data cleared","ok"); renderPage(); }
async function _doResetAll(){ Object.keys(STORES).filter(k=>!["s1","s2","s3"].includes(k)).forEach(k=>delete STORES[k]); DB={users:JSON.parse(JSON.stringify(DEFAULT_USERS)),products:JSON.parse(JSON.stringify(DEFAULT_PRODUCTS)),stock:JSON.parse(JSON.stringify(DEFAULT_STOCK)),receipts:[],issuances:[],movements:[],destinations:JSON.parse(JSON.stringify(DEFAULT_DESTINATIONS)),storeList:[]}; idCounter=1000; await saveDB(); refreshStoreSwitcher(); doLogout(); }
function exportReceivedCSV2(from,to){
  const keys=getKeys();const filtered=DB.receipts.filter(r=>keys.includes(r.store)&&r.confirmed&&r.date>=from&&r.date<=to);
  const rows=[["GRN Ref","Store","Supplier","Date","Product SKU","Product Name","Qty","Unit Cost","Line Value","Confirmed At"]];
  filtered.forEach(r=>{r.items.forEach(item=>{rows.push([`GRN-${r.id}`,STORES[r.store]?.name,r.supplier,r.date,item.sku,item.name,item.qty,item.cost,item.lineVal,r.confirmedAt||""]);});});
  downloadCSV(rows,`received_${from}_to_${to}`);
}
function exportIssuedCSV2(from,to){
  const keys=getKeys();const filtered=DB.issuances.filter(r=>keys.includes(r.store)&&r.confirmed&&r.date>=from&&r.date<=to);
  const rows=[["ISS Ref","Store","Destination","Issued To","Date","Product SKU","Product Name","Qty","Unit Cost","Line Value","Confirmed At"]];
  filtered.forEach(r=>{r.items.forEach(item=>{rows.push([`ISS-${r.id}`,STORES[r.store]?.name,r.destination,r.issuedTo||"",r.date,item.sku,item.name,item.qty,item.cost,item.lineVal,r.confirmedAt||""]);});});
  downloadCSV(rows,`issued_${from}_to_${to}`);
}

oseModal()">Cancel</button></div>`);

async function addProductFromModal(){
  const name = document.getElementById('m_pname').value.trim();
  const cat = document.getElementById('m_pcat').value;
  const unit = document.getElementById('m_punit').value.trim();
  let sku = document.getElementById('m_psku').value.trim().toUpperCase();
  const cost = parseInt(document.getElementById('m_pcost').value) || 0;
  const price = parseInt(document.getElementById('m_pprice').value) || cost;
  const storeScope = document.getElementById('m_pstore').value || null;
  const errDiv = document.getElementById('m_perr');
  if(!name || !unit){ errDiv.textContent='Product name and unit are required.'; errDiv.style.display='block'; return; }
  if(cost <= 0){ errDiv.textContent='Cost price is required.'; errDiv.style.display='block'; return; }
  if(!sku){ const prefix=cat.slice(0,2).toUpperCase(); sku=`${prefix}-${(DB.products.length+1).toString().padStart(3,'0')}`; }
  if(DB.products.find(p=>p.sku===sku)){ errDiv.textContent='SKU already exists.'; errDiv.style.display='block'; return; }
  DB.products.push({sku,name,cat,unit,cost,price,storeScope:storeScope||null,createdBy:CU,createdAt:todayVal()});
  const key = skuKey(sku);
  const allStoreKeys = Object.keys(STORES);
  if(storeScope){
    const qty = parseInt(document.getElementById('m_psingle').value)||0;
    const reorder = parseInt(document.getElementById('m_preorder2').value)||10;
    const max = parseInt(document.getElementById('m_pmax2').value)||100;
    allStoreKeys.forEach(s=>{
      if(!DB.stock[s]) DB.stock[s]={};
      DB.stock[s][key] = s===storeScope ? {qty,reorder,max} : {qty:0,reorder,max};
    });
  } else {
    const reorder = parseInt(document.getElementById('m_preorder').value)||10;
    const max = parseInt(document.getElementById('m_pmax').value)||100;
    allStoreKeys.forEach(s=>{
      if(!DB.stock[s]) DB.stock[s]={};
      const qtyEl = document.getElementById(`m_ps_${s}`);
      const qty = qtyEl ? (parseInt(qtyEl.value)||0) : 0;
      DB.stock[s][key] = {qty,reorder,max};
    });
  }
  await saveDB(); closeModal(); renderProducts(); showToast('Product added','ok');
}

async function saveEditProduct(sku){
  const p=DB.products.find(x=>x.sku===sku);if(!p)return;
  const name=document.getElementById("e_pname").value.trim();
  const unit=document.getElementById("e_punit").value.trim();
  if(!name||!unit){alert("Name and unit required");return;}
  p.name=name;p.cat=document.getElementById("e_pcat").value;p.unit=unit;
  p.cost=parseInt(document.getElementById("e_pcost").value)||p.cost;
  p.price=parseInt(document.getElementById("e_pprice").value)||p.price;
  const key=skuKey(sku);
  ["s1","s2","s3"].forEach((s,i)=>{ if(!DB.stock[s][key])DB.stock[s][key]={qty:0,reorder:10,max:100}; DB.stock[s][key].reorder=parseInt(document.getElementById(`e_r${i+1}`).value)||10; DB.stock[s][key].max=parseInt(document.getElementById(`e_m${i+1}`).value)||100; });
  await saveDB();closeModal();renderProducts(); showToast("Product updated","ok");
}
function autoCalcPrice(){ const c=parseFloat(document.getElementById("m_pcost")?.value)||0; const pp=document.getElementById("m_pprice"); if(pp&&!pp._manual&&c>0)pp.value=Math.round(c*1.3); if(pp)pp.addEventListener("input",()=>pp._manual=true,{once:true}); }
function liveProdSearch(v){ productSearchTerm=v; clearTimeout(window._prodSearchTimer); window._prodSearchTimer=setTimeout(()=>renderProducts(),100); }
function closeDotMenus(){ document.querySelectorAll(".dot-dropdown").forEach(d=>d.classList.add("hidden")); }
function closeDotMenusOnClickOut(){ closeDotMenus(); }
function toggleDotMenu(id,e){ e.stopPropagation(); closeDotMenus(); document.getElementById(id)?.classList.toggle("hidden"); setTimeout(()=>{document.addEventListener("click",function closeHandler(){closeDotMenus();document.removeEventListener("click",closeHandler);});},100); }

function renderPage(){ 
  if(CP==="overview")renderOverview(); else if(CP==="stock")renderStock(); else if(CP==="receive")renderReceive(); else if(CP==="issue")renderIssue(); 
  else if(CP==="reorder")renderReorder(); else if(CP==="products")renderProducts(); else if(CP==="history")renderHistory(); 
  else if(CP==="reports")renderReports(); else if(CP==="users")renderUsers(); else if(CP==="admin")renderAdmin(); 
}
